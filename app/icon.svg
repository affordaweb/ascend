<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123d2d"/>
      <stop offset="100%" stop-color="#1f5139"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5d5b8"/>
      <stop offset="100%" stop-color="#b78b58"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle top highlight -->
  <rect width="32" height="1.5" rx="1.5" fill="white" opacity="0.06"/>
  <!-- Gold bottom accent line -->
  <rect x="10" y="29" width="12" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.7"/>
  <!-- Letter A — serif style -->
  <text
    x="16"
    y="23.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="700"
    fill="url(#gold)"
    letter-spacing="-0.5"
  >A</text>
</svg>
