<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <!-- Dark room background -->
    <radialGradient id="roomBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#3a2010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0c05;stop-opacity:1" />
    </radialGradient>
    <!-- Table wood radial gradient -->
    <radialGradient id="tableGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c8945a;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#a87040;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#8b5e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b3a1a;stop-opacity:1" />
    </radialGradient>
    <!-- Table edge shadow -->
    <radialGradient id="tableEdge" cx="50%" cy="50%" r="50%">
      <stop offset="78%" style="stop-color:#00000000" />
      <stop offset="90%" style="stop-color:#1a0800" stop-opacity="0.5" />
      <stop offset="100%" style="stop-color:#0a0400" stop-opacity="0.85" />
    </radialGradient>
    <!-- Overhead light spot -->
    <radialGradient id="overheadLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff8e8;stop-opacity:0.22" />
      <stop offset="70%" style="stop-color:#f0d880;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#f0d880;stop-opacity:0" />
    </radialGradient>
    <!-- Notebook fill -->
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e0cc;stop-opacity:1" />
    </linearGradient>
    <!-- Map gradient -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e8d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ddd0b0;stop-opacity:1" />
    </linearGradient>
    <!-- Plant pot top-down -->
    <radialGradient id="plantPot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5e3c;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#6b3a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2810;stop-opacity:1" />
    </radialGradient>
    <!-- Plant soil -->
    <radialGradient id="soilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3a2010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1808;stop-opacity:1" />
    </radialGradient>
    <!-- Drop shadows -->
    <filter id="notebookShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="6" flood-color="#1a0800" flood-opacity="0.55" />
    </filter>
    <filter id="itemShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#1a0800" flood-opacity="0.5" />
    </filter>
    <filter id="mapShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="6" stdDeviation="7" flood-color="#1a0800" flood-opacity="0.45" />
    </filter>
    <!-- Wood grain clip -->
    <clipPath id="tableClip">
      <circle cx="300" cy="225" r="195" />
    </clipPath>
  </defs>

  <!-- Room background -->
  <rect width="600" height="450" fill="url(#roomBg)" />

  <!-- Table circle with wood grain -->
  <circle cx="300" cy="225" r="195" fill="url(#tableGrad)" />

  <!-- Wood grain lines — radial flowing paths -->
  <g clip-path="url(#tableClip)" opacity="0.55">
    <!-- Grain lines flowing across table surface -->
    <path d="M 115,180 C 140,170 200,165 260,168 C 320,171 380,178 440,175 C 470,174 490,172 500,170" fill="none" stroke="#d4a870" stroke-width="1.2" />
    <path d="M 110,195 C 138,185 200,180 265,183 C 325,186 385,194 445,190 C 475,188 492,186 502,184" fill="none" stroke="#c8945a" stroke-width="0.8" />
    <path d="M 108,210 C 136,200 199,195 263,198 C 323,201 382,209 443,205 C 474,203 491,200 503,198" fill="none" stroke="#d4a870" stroke-width="1.4" />
    <path d="M 107,225 C 134,216 198,211 262,214 C 322,217 381,225 442,221 C 473,219 490,216 504,214" fill="none" stroke="#b87840" stroke-width="0.9" />
    <path d="M 108,240 C 135,232 199,227 263,230 C 323,233 382,241 443,237 C 474,235 491,233 504,231" fill="none" stroke="#d4a870" stroke-width="1.1" />
    <path d="M 110,255 C 138,247 201,242 265,245 C 325,248 384,256 445,252 C 476,250 492,248 504,247" fill="none" stroke="#c8945a" stroke-width="0.7" />
    <path d="M 113,270 C 141,262 203,257 267,260 C 327,263 386,272 447,268 C 477,266 494,264 504,263" fill="none" stroke="#d4a870" stroke-width="1.3" />
    <path d="M 118,285 C 144,277 205,273 268,276 C 328,279 388,288 449,284 C 478,282 495,280 504,279" fill="none" stroke="#b87840" stroke-width="0.8" />
    <!-- Subtle knot rings -->
    <ellipse cx="230" cy="215" rx="22" ry="14" fill="none" stroke="#a06030" stroke-width="1.2" opacity="0.6" transform="rotate(-5,230,215)" />
    <ellipse cx="232" cy="214" rx="14" ry="9" fill="none" stroke="#8b4820" stroke-width="1" opacity="0.5" transform="rotate(-5,232,214)" />
    <ellipse cx="370" cy="248" rx="18" ry="11" fill="none" stroke="#a06030" stroke-width="1.1" opacity="0.5" transform="rotate(8,370,248)" />
    <!-- Additional grain detail lines -->
    <path d="M 120,158 C 155,148 220,143 290,148 C 355,152 410,162 455,158" fill="none" stroke="#c09050" stroke-width="0.7" opacity="0.7" />
    <path d="M 125,298 C 158,291 220,288 288,291 C 352,294 408,302 452,298" fill="none" stroke="#c09050" stroke-width="0.7" opacity="0.7" />
    <path d="M 140,310 C 170,304 228,302 294,305 C 356,308 410,316 450,312" fill="none" stroke="#b88040" stroke-width="0.9" opacity="0.6" />
  </g>

  <!-- Table surface highlight (overhead light) -->
  <circle cx="300" cy="225" r="195" fill="url(#overheadLight)" />

  <!-- Table edge ring -->
  <circle cx="300" cy="225" r="195" fill="none" stroke="#4a2810" stroke-width="6" opacity="0.8" />
  <circle cx="300" cy="225" r="190" fill="none" stroke="#8b5020" stroke-width="2.5" opacity="0.5" />
  <circle cx="300" cy="225" r="195" fill="url(#tableEdge)" />

  <!-- TABLE SHADOW cast on floor (ellipse below) -->
  <ellipse cx="308" cy="428" rx="190" ry="22" fill="#0a0400" opacity="0.55" />

  <!-- FOLDED MAP — bottom left area, partially unrolled -->
  <g filter="url(#mapShadow)">
    <!-- Map body -->
    <path d="M 115,290 C 115,278 118,268 124,264 L 310,242 C 316,240 320,244 320,250 L 318,326 C 318,332 314,336 308,336 L 122,354 C 116,356 112,352 112,346 Z" fill="url(#mapGrad)" />
    <!-- Folded edge at top -->
    <path d="M 124,264 L 130,258 L 316,236 L 310,242 Z" fill="#e0d4b8" />
    <!-- Map contour lines -->
    <path d="M 135,290 C 150,284 175,282 200,285 C 225,288 245,296 265,294 C 285,292 300,286 308,284" fill="none" stroke="#a09070" stroke-width="1" opacity="0.7" />
    <path d="M 130,302 C 148,296 175,294 203,298 C 228,302 250,310 272,308 C 292,306 306,300 314,298" fill="none" stroke="#a09070" stroke-width="0.9" opacity="0.65" />
    <path d="M 128,314 C 146,308 173,307 200,311 C 228,315 252,323 274,320 C 295,317 308,312 316,310" fill="none" stroke="#a09070" stroke-width="0.8" opacity="0.6" />
    <path d="M 127,326 C 145,320 172,319 199,324 C 228,329 253,337 276,333 C 297,330 310,325 316,323" fill="none" stroke="#a09070" stroke-width="0.8" opacity="0.55" />
    <path d="M 127,338 C 145,333 172,332 200,337 C 229,342 255,349 278,345 C 300,341 312,337 317,335" fill="none" stroke="#a09070" stroke-width="0.7" opacity="0.5" />
    <!-- Terrain label marks -->
    <rect x="155" y="296" width="28" height="5" fill="#b0a080" opacity="0.35" rx="1" />
    <rect x="240" y="312" width="22" height="4" fill="#b0a080" opacity="0.3" rx="1" />
    <rect x="185" y="328" width="18" height="4" fill="#b0a080" opacity="0.3" rx="1" />
    <!-- Map edge fold crease -->
    <path d="M 118,272 L 122,354" fill="none" stroke="#c0b090" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- OPEN NOTEBOOK — center-right -->
  <g filter="url(#notebookShadow)">
    <!-- Notebook body -->
    <rect x="290" y="148" width="175" height="140" rx="3" fill="url(#notebookGrad)" transform="rotate(6, 377, 218)" />
    <!-- Notebook spine line -->
    <line x1="373" y1="148" x2="367" y2="288" stroke="#c0b898" stroke-width="2.5" opacity="0.6" transform="rotate(6, 370, 218)" />
    <!-- Left page -->
    <rect x="292" y="150" width="80" height="136" rx="2" fill="#f5f2e6" transform="rotate(6, 332, 218)" />
    <!-- Right page -->
    <rect x="374" y="150" width="89" height="136" rx="2" fill="#f0ecd8" transform="rotate(6, 418, 218)" />
    <!-- Notebook cover edge shadow -->
    <rect x="290" y="148" width="175" height="6" rx="3" fill="#d0c8a8" transform="rotate(6, 377, 151)" opacity="0.7" />

    <!-- Left page: sketched diagrams -->
    <g transform="rotate(6, 332, 218)">
      <!-- Ruled lines -->
      <line x1="298" y1="168" x2="368" y2="168" stroke="#c8c0a0" stroke-width="0.8" opacity="0.7" />
      <line x1="298" y1="178" x2="368" y2="178" stroke="#c8c0a0" stroke-width="0.8" opacity=" 0.7" />
      <line x1="298" y1="188" x2="368" y2="188" stroke="#c8c0a0" stroke-width="0.8" opacity="0.7" />
      <line x1="298" y1="198" x2="368" y2="198" stroke="#c8c0a0" stroke-width="0.8" opacity="0.7" />
      <!-- Flow diagram boxes -->
      <rect x="300" y="210" width="30" height="18" rx="2" fill="none" stroke="#808060" stroke-width="1.2" />
      <rect x="340" y="210" width="24" height="18" rx="2" fill="none" stroke="#808060" stroke-width="1.2" />
      <line x1="330" y1="219" x2="340" y2="219" stroke="#606040" stroke-width="1" marker-end="url(#arrowHead)" />
      <!-- Arrow manually drawn -->
      <path d="M 330,219 L 338,219 L 336,216 M 338,219 L 336,222" fill="none" stroke="#606040" stroke-width="1" />
      <!-- Small node circles -->
      <circle cx="308" cy="248" r="7" fill="none" stroke="#708050" stroke-width="1.2" />
      <circle cx="330" cy="248" r="5" fill="none" stroke="#708050" stroke-width="1" />
      <circle cx="352" cy="248" r="7" fill="none" stroke="#708050" stroke-width="1.2" />
      <line x1="315" y1="248" x2="325" y2="248" stroke="#606040" stroke-width="0.9" />
      <line x1="335" y1="248" x2="345" y2="248" stroke="#606040" stroke-width="0.9" />
      <!-- Scribble text lines -->
      <line x1="300" y1="265" x2="355" y2="265" stroke="#909070" stroke-width="0.7" opacity="0.6" />
      <line x1="300" y1="272" x2="342" y2="272" stroke="#909070" stroke-width="0.7" opacity="0.5" />
      <line x1="300" y1="279" x2="350" y2="279" stroke="#909070" stroke-width="0.7" opacity="0.5" />
    </g>
    <!-- Right page: more diagrams -->
    <g transform="rotate(6, 418, 218)">
      <!-- Ruled lines -->
      <line x1="380" y1="162" x2="458" y2="162" stroke="#c8c0a0" stroke-width="0.8" opacity="0.6" />
      <line x1="380" y1="172" x2="458" y2="172" stroke="#c8c0a0" stroke-width="0.8" opacity="0.6" />
      <!-- Sketch: staircase/bar chart -->
      <path d="M 385,240 L 385,220 L 395,220 L 395,210 L 408,210 L 408,198 L 420,198 L 420,185 L 435,185 L 435,175" fill="none" stroke="#607050" stroke-width="1.5" />
      <!-- Horizontal reference line -->
      <line x1="382" y1="240" x2="452" y2="240" stroke="#a09878" stroke-width="0.8" opacity="0.7" />
      <!-- Annotation dot -->
      <circle cx="435" cy="175" r="3.5" fill="#f59e0b" opacity="0.9" />
      <!-- Text scribbles -->
      <line x1="382" y1="258" x2="456" y2="258" stroke="#909070" stroke-width="0.7" opacity="0.55" />
      <line x1="382" y1="265" x2="448" y2="265" stroke="#909070" stroke-width="0.7" opacity="0.5" />
      <line x1="382" y1="272" x2="454" y2="272" stroke="#909070" stroke-width="0.7" opacity="0.5" />
      <line x1="382" y1="279" x2="440" y2="279" stroke="#909070" stroke-width="0.7" opacity="0.45" />
    </g>
  </g>

  <!-- COMPASS — upper right area of table -->
  <g filter="url(#itemShadow)" transform="translate(430, 156) rotate(-18)">
    <!-- Compass outer ring -->
    <circle cx="0" cy="0" r="28" fill="#c8a050" />
    <circle cx="0" cy="0" r="25" fill="#d4b060" />
    <circle cx="0" cy="0" r="23" fill="#b89040" />
    <!-- Compass face -->
    <circle cx="0" cy="0" r="20" fill="#f0e8d0" />
    <circle cx="0" cy="0" r="18" fill="#e8dcc0" />
    <!-- Degree marks -->
    <g stroke="#806040" stroke-width="0.8" opacity="0.7">
      <line x1="0" y1="-15" x2="0" y2="-18" />
      <line x1="0" y1="15" x2="0" y2="18" />
      <line x1="-15" y1="0" x2="-18" y2="0" />
      <line x1="15" y1="0" x2="18" y2="0" />
      <line x1="-10.6" y1="-10.6" x2="-12.7" y2="-12.7" />
      <line x1="10.6" y1="-10.6" x2="12.7" y2="-12.7" />
      <line x1="-10.6" y1="10.6" x2="-12.7" y2="12.7" />
      <line x1="10.6" y1="10.6" x2="12.7" y2="12.7" />
    </g>
    <!-- Cardinal letters -->
    <text x="0" y="-7" text-anchor="middle" font-family="serif" font-size="5" fill="#4a2810" font-weight="bold">N</text>
    <text x="0" y="11" text-anchor="middle" font-family="serif" font-size="5" fill="#4a2810">S</text>
    <text x="-11" y="2" text-anchor="middle" font-family="serif" font-size="5" fill="#4a2810">W</text>
    <text x="11" y="2" text-anchor="middle" font-family="serif" font-size="5" fill="#4a2810">E</text>
    <!-- Compass needle - red north -->
    <path d="M 0,-14 L 2.5,0 L 0,2 L -2.5,0 Z" fill="#c02020" />
    <path d="M 0,14 L 2.5,0 L 0,2 L -2.5,0 Z" fill="#e8dcc0" />
    <!-- Center pin -->
    <circle cx="0" cy="0" r="2.5" fill="#a07030" />
    <circle cx="0" cy="0" r="1.2" fill="#c8a050" />
  </g>

  <!-- PENS — 4 pens scattered -->
  <!-- Pen 1 — diagonal, upper left of notebook -->
  <g filter="url(#itemShadow)">
    <rect x="160" y="178" width="7" height="70" rx="3.5" fill="#c02020" transform="rotate(25, 163, 213)" />
    <rect x="160" y="178" width="7" height="14" rx="3.5" fill="#a01818" transform="rotate(25, 163, 213)" />
    <rect x="160" y="240" width="7" height="8" rx="2" fill="#d0d0d0" transform="rotate(25, 163, 213)" />
    <!-- Clip -->
    <rect x="162.5" y="180" width="2" height="18" rx="1" fill="#d04030" transform="rotate(25, 163, 213)" />
  </g>

  <!-- Pen 2 — near compass, angled right -->
  <g filter="url(#itemShadow)">
    <rect x="390" y="200" width="6" height="65" rx="3" fill="#1a3d8a" transform="rotate(-12, 393, 232)" />
    <rect x="390" y="200" width="6" height="12" rx="3" fill="#142d6a" transform="rotate(-12, 393, 232)" />
    <rect x="390" y="258" width="6" height="7" rx="2" fill="#c8c8c8" transform="rotate(-12, 393, 232)" />
    <rect x="392" y="202" width="2" height="16" rx="1" fill="#2a4d9a" transform="rotate(-12, 393, 232)" />
  </g>

  <!-- Pen 3 — bottom area horizontal -->
  <g filter="url(#itemShadow)">
    <rect x="240" y="360" width="80" height="7" rx="3.5" fill="#1a6040" transform="rotate(-5, 280, 363)" />
    <rect x="240" y="360" width="14" height="7" rx="3.5" fill="#124830" transform="rotate(-5, 280, 363)" />
    <rect x="310" y="360" width="10" height="7" rx="2" fill="#b8b8b8" transform="rotate(-5, 280, 363)" />
  </g>

  <!-- Pen 4 — right side of table, pointing down-right -->
  <g filter="url(#itemShadow)">
    <rect x="410" y="305" width="6" height="68" rx="3" fill="#8b5e10" transform="rotate(35, 413, 339)" />
    <rect x="410" y="305" width="6" height="12" rx="3" fill="#6b4008" transform="rotate(35, 413, 339)" />
    <rect x="410" y="365" width="6" height="8" rx="2" fill="#d0c8b0" transform="rotate(35, 413, 339)" />
  </g>

  <!-- SMALL POTTED PLANT — table center top view -->
  <g filter="url(#itemShadow)" transform="translate(300, 228)">
    <!-- Pot rim (circle, top-down) -->
    <circle cx="0" cy="0" r="30" fill="url(#plantPot)" />
    <circle cx="0" cy="0" r="26" fill="url(#soilGrad)" />
    <!-- Soil surface texture -->
    <circle cx="0" cy="0" r="24" fill="#3a2010" opacity="0.6" />
    <!-- Leaves radiating from center — top-down view -->
    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#2d5016" transform="rotate(0)" />
    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#4a7c35" transform="rotate(60, 0, 0)" />
    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#2d5016" transform="rotate(120, 0, 0)" />
    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#3a6828" transform="rotate(180, 0, 0)" />
    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#4a7c35" transform="rotate(240, 0, 0)" />
    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#2d5016" transform="rotate(300, 0, 0)" />
    <!-- Center point -->
    <circle cx="0" cy="0" r="5" fill="#1a3d1a" />
    <!-- Pot highlight arc -->
    <path d="M -26,4 A 26,26 0 0,1 0,-26" fill="none" stroke="#c8a878" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Overhead warm light glow on surface -->
  <circle cx="300" cy="225" r="195" fill="url(#overheadLight)" />

</svg>
