<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <!-- Sky gradient through window -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4e8f0"/>
      <stop offset="60%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#f5fafc"/>
    </linearGradient>

    <!-- Far hills gradient -->
    <linearGradient id="hillsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c35"/>
      <stop offset="100%" stop-color="#2d5016"/>
    </linearGradient>

    <!-- Near hills gradient -->
    <linearGradient id="nearHillsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6828"/>
      <stop offset="100%" stop-color="#1a3d1a"/>
    </linearGradient>

    <!-- Desk wood gradient -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a6a40"/>
      <stop offset="40%" stop-color="#8b5e3c"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>

    <!-- Morning light on desk -->
    <radialGradient id="morningLight" cx="15%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdf8ec" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#f5e8c8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5e8c8" stop-opacity="0"/>
    </radialGradient>

    <!-- Envelope gradient -->
    <linearGradient id="envelopeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf8ee"/>
      <stop offset="100%" stop-color="#f0e8d0"/>
    </linearGradient>

    <!-- Wax seal gradient -->
    <radialGradient id="sealGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c84020"/>
      <stop offset="100%" stop-color="#8b1a08"/>
    </radialGradient>

    <!-- Pen gradient -->
    <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="30%" stop-color="#1a1a1a"/>
      <stop offset="70%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>

    <!-- Succulent pot gradient -->
    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b07040"/>
      <stop offset="100%" stop-color="#8b5e3c"/>
    </linearGradient>

    <!-- Drop shadow filters -->
    <filter id="envelopeShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#4a2a10" flood-opacity="0.4"/>
    </filter>
    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#2a1808" flood-opacity="0.45"/>
    </filter>
    <filter id="potShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#2a1808" flood-opacity="0.4"/>
    </filter>
    <filter id="deskShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="-8" stdDeviation="12" flood-color="#2a1808" flood-opacity="0.5"/>
    </filter>
    <filter id="windowGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d4e8f0" flood-opacity="0.5"/>
    </filter>

    <!-- Clip paths -->
    <clipPath id="leftPaneClip">
      <rect x="105" y="62" width="165" height="220"/>
    </clipPath>
    <clipPath id="rightPaneClip">
      <rect x="285" y="62" width="165" height="220"/>
    </clipPath>
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="600" height="450"/>
    </clipPath>
  </defs>

  <!-- ============ ROOM WALL BACKGROUND ============ -->
  <!-- Warm off-white wall -->
  <rect x="0" y="0" width="600" height="450" fill="#f5ede0"/>
  <!-- Subtle wall texture -->
  <rect x="0" y="0" width="600" height="450" fill="#ede5d8" opacity="0.3"/>
  <!-- Wall shadow at top and sides -->
  <rect x="0" y="0" width="600" height="80" fill="#d8cfc0" opacity="0.2"/>
  <!-- Baseboard area -->
  <rect x="0" y="390" width="600" height="60" fill="#e0d5c5" opacity="0.4"/>

  <!-- ============ WINDOW FRAME OUTER ============ -->
  <!-- Window niche / reveal depth -->
  <rect x="88" y="45" width="384" height="258" rx="4" fill="#6b4226"/>
  <!-- Inner niche shadow -->
  <rect x="92" y="48" width="380" height="255" rx="3" fill="#4a2a14"/>

  <!-- Window frame background (wall color visible at edges = reveal) -->
  <rect x="95" y="52" width="370" height="248" rx="2" fill="#5a3820"/>

  <!-- ============ WINDOW GLASS AREA ============ -->
  <!-- Left pane -->
  <rect x="105" y="62" width="165" height="220" rx="1" fill="url(#skyGrad)" filter="url(#windowGlow)"/>
  <!-- Right pane -->
  <rect x="285" y="62" width="165" height="220" rx="1" fill="url(#skyGrad)" filter="url(#windowGlow)"/>

  <!-- ============ LANDSCAPE THROUGH LEFT PANE ============ -->
  <g clip-path="url(#leftPaneClip)">
    <!-- Sky -->
    <rect x="105" y="62" width="165" height="220" fill="url(#skyGrad)"/>

    <!-- Distant mountain silhouette -->
    <path d="M105,175 Q130,140 155,155 Q170,165 180,145 Q195,125 215,150 Q235,170 270,162 L270,200 L105,200 Z" fill="#4a5878" opacity="0.55"/>
    <!-- Mountain highlight -->
    <path d="M175,147 Q180,143 185,148" stroke="#8090a8" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Far rolling hills -->
    <path d="M105,183 Q130,168 160,175 Q185,180 210,170 Q235,160 270,172 L270,220 L105,220 Z" fill="#6a9850" opacity="0.7"/>

    <!-- Near lush hills -->
    <path d="M105,200 Q125,188 148,194 Q168,200 188,190 Q210,179 235,188 Q252,195 270,189 L270,282 L105,282 Z" fill="url(#nearHillsGrad)"/>

    <!-- Tree silhouette left pane -->
    <path d="M115,195 Q113,182 118,165 Q120,150 115,135" stroke="#1a3d1a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="115" cy="135" rx="22" ry="30" fill="#1a3d1a" opacity="0.85"/>
    <ellipse cx="108" cy="148" rx="16" ry="20" fill="#1a3d1a" opacity="0.75"/>
    <ellipse cx="125" cy="145" rx="14" ry="18" fill="#2d5016" opacity="0.7"/>

    <!-- Small tree right of left pane -->
    <path d="M238,198 Q236,186 240,172" stroke="#1a3d1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="238" cy="170" rx="16" ry="20" fill="#2d5016" opacity="0.8"/>

    <!-- Soft morning haze at horizon -->
    <rect x="105" y="172" width="165" height="18" fill="#f0f8ff" opacity="0.3"/>
  </g>

  <!-- ============ LANDSCAPE THROUGH RIGHT PANE ============ -->
  <g clip-path="url(#rightPaneClip)">
    <!-- Sky continuation -->
    <rect x="285" y="62" width="165" height="220" fill="url(#skyGrad)"/>

    <!-- Distant mountain continuation -->
    <path d="M285,165 Q310,148 335,162 Q355,172 375,150 Q390,132 415,155 Q435,172 450,165 L450,200 L285,200 Z" fill="#4a5878" opacity="0.5"/>

    <!-- Far rolling hills -->
    <path d="M285,180 Q315,166 345,173 Q370,178 400,168 Q425,158 450,170 L450,218 L285,218 Z" fill="#6a9850" opacity="0.65"/>

    <!-- Near lush hills -->
    <path d="M285,196 Q305,184 328,190 Q348,196 368,186 Q390,175 415,184 Q432,191 450,185 L450,282 L285,282 Z" fill="url(#nearHillsGrad)"/>

    <!-- Tree silhouette right pane far right -->
    <path d="M438,196 Q436,183 440,168 Q442,153 438,138" stroke="#1a3d1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="438" cy="138" rx="19" ry="26" fill="#1a3d1a" opacity="0.85"/>
    <ellipse cx="430" cy="152" rx="14" ry="18" fill="#1a3d1a" opacity="0.75"/>

    <!-- Group of shrubs right pane -->
    <ellipse cx="310" cy="195" rx="18" ry="12" fill="#2d5016" opacity="0.7"/>
    <ellipse cx="325" cy="191" rx="14" ry="10" fill="#1a3d1a" opacity="0.65"/>
    <ellipse cx="298" cy="197" rx="12" ry="9" fill="#3a6828" opacity="0.6"/>

    <!-- Soft morning haze at horizon -->
    <rect x="285" y="168" width="165" height="18" fill="#f0f8ff" opacity="0.3"/>
  </g>

  <!-- ============ WINDOW FRAME STRUCTURE ============ -->
  <!-- Vertical center mullion -->
  <rect x="268" y="55" width="24" height="238" rx="3" fill="#3d2010"/>
  <rect x="271" y="55" width="5" height="238" fill="#5a3820" opacity="0.4"/>

  <!-- Top horizontal rail -->
  <rect x="98" y="55" width="364" height="20" rx="3" fill="#3d2010"/>
  <rect x="100" y="57" width="360" height="6" fill="#5a3820" opacity="0.35"/>

  <!-- Bottom horizontal rail -->
  <rect x="98" y="275" width="364" height="20" rx="3" fill="#3d2010"/>
  <rect x="100" y="275" width="360" height="6" fill="#5a3820" opacity="0.35"/>

  <!-- Left vertical stile -->
  <rect x="98" y="55" width="20" height="240" rx="2" fill="#3d2010"/>
  <rect x="100" y="55" width="5" height="240" fill="#5a3820" opacity="0.35"/>

  <!-- Right vertical stile -->
  <rect x="442" y="55" width="20" height="240" rx="2" fill="#3d2010"/>
  <rect x="444" y="55" width="5" height="240" fill="#5a3820" opacity="0.35"/>

  <!-- Window sill at bottom -->
  <rect x="82" y="293" width="396" height="18" rx="3" fill="#4a2a14"/>
  <rect x="84" y="295" width="392" height="8" fill="#6b4226" opacity="0.6"/>
  <!-- Sill front edge -->
  <rect x="78" y="308" width="404" height="10" rx="2" fill="#3d2010"/>

  <!-- Window latch hardware -->
  <rect x="272" y="192" width="16" height="10" rx="2" fill="#c8a050"/>
  <ellipse cx="280" cy="197" rx="5" ry="3.5" fill="#d4b060" stroke="#a07830" stroke-width="1"/>

  <!-- ============ MORNING LIGHT EFFECT ============ -->
  <!-- Light spill from window onto wall/floor -->
  <path d="M98,62 Q100,150 102,295 L82,305 L70,50 Z" fill="#f5f0e0" opacity="0.12"/>
  <path d="M462,62 Q460,150 458,295 L478,305 L490,50 Z" fill="#f5f0e0" opacity="0.08"/>

  <!-- ============ DESK ============ -->
  <!-- Desk top face - warm wood -->
  <path d="M0,315 Q150,308 300,312 Q450,316 600,308 L600,380 Q450,375 300,378 Q150,380 0,375 Z" fill="url(#deskGrad)" filter="url(#deskShadow)"/>

  <!-- Wood grain lines on desk -->
  <path d="M0,325 Q100,322 200,328 Q300,334 400,326 Q500,318 600,322" stroke="#7a5030" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M0,335 Q120,332 240,338 Q360,344 480,336 Q540,332 600,335" stroke="#7a5030" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M0,345 Q80,342 160,348 Q240,354 320,346 Q400,338 480,345 Q540,350 600,347" stroke="#7a5030" stroke-width="0.8" fill="none" opacity="0.28"/>
  <path d="M0,358 Q150,355 300,361 Q450,367 600,360" stroke="#7a5030" stroke-width="0.8" fill="none" opacity="0.25"/>
  <path d="M0,370 Q120,367 240,373 Q360,379 480,371 Q540,367 600,370" stroke="#7a5030" stroke-width="0.8" fill="none" opacity="0.22"/>
  <!-- Knot detail in wood -->
  <ellipse cx="120" cy="352" rx="12" ry="8" fill="none" stroke="#5a3820" stroke-width="1.2" opacity="0.35" transform="rotate(-5, 120, 352)"/>
  <ellipse cx="120" cy="352" rx="6" ry="4" fill="none" stroke="#5a3820" stroke-width="1" opacity="0.3" transform="rotate(-5, 120, 352)"/>

  <!-- Morning light cast on desk from window -->
  <path d="M98,310 Q120,308 200,308 Q270,308 380,312 Q420,314 465,310 L465,380 Q420,378 380,378 Q270,376 200,376 Q120,376 98,378 Z" fill="url(#morningLight)"/>

  <!-- Desk front edge -->
  <path d="M0,375 Q150,378 300,380 Q450,380 600,376 L600,395 Q450,398 300,400 Q150,400 0,396 Z" fill="#6b4226"/>
  <path d="M0,393 Q300,398 600,393 L600,400 Q300,406 0,400 Z" fill="#4a2a14" opacity="0.6"/>

  <!-- ============ ENVELOPE ============ -->
  <g filter="url(#envelopeShadow)" transform="translate(205, 320)">
    <!-- Envelope body -->
    <rect x="0" y="0" width="160" height="105" rx="4" fill="url(#envelopeGrad)"/>
    <!-- Envelope fold lines (diamond fold) -->
    <path d="M0,0 L80,52 L160,0" stroke="#d8c8a8" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M0,105 L80,52 L160,105" stroke="#d8c8a8" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M0,0 L0,105" stroke="#c8b898" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M160,0 L160,105" stroke="#c8b898" stroke-width="0.8" fill="none" opacity="0.4"/>
    <!-- Envelope flap line -->
    <path d="M4,3 L80,52 L156,3" stroke="#c0b090" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Slight shadow under flap triangle -->
    <path d="M0,0 Q80,55 160,0 L155,0 Q80,50 5,0 Z" fill="#c8b898" opacity="0.25"/>

    <!-- Wax seal -->
    <circle cx="80" cy="55" r="16" fill="url(#sealGrad)"/>
    <circle cx="80" cy="55" r="14" fill="none" stroke="#701808" stroke-width="1" opacity="0.6"/>
    <!-- Seal emboss texture -->
    <path d="M80,44 L82,51 L89,51 L84,56 L86,63 L80,59 L74,63 L76,56 L71,51 L78,51 Z" fill="#a82010" opacity="0.6"/>
    <!-- Seal highlight -->
    <ellipse cx="73" cy="48" rx="5" ry="3" fill="#e04828" opacity="0.4" transform="rotate(-30, 73, 48)"/>
  </g>

  <!-- ============ FOUNTAIN PEN ============ -->
  <g filter="url(#penShadow)" transform="rotate(-25, 310, 360)">
    <!-- Pen body main -->
    <rect x="160" y="325" width="140" height="13" rx="6" fill="url(#penGrad)"/>
    <!-- Pen clip -->
    <rect x="165" y="320" width="4" height="20" rx="2" fill="#c8a050"/>
    <!-- Gold band near nib end -->
    <rect x="285" y="324" width="8" height="15" rx="1" fill="#d4b060"/>
    <rect x="286" y="325" width="2" height="13" rx="1" fill="#f0c870" opacity="0.5"/>
    <!-- Pen cap section -->
    <rect x="160" y="325" width="50" height="13" rx="6" fill="#1a1a1a"/>
    <rect x="207" y="326" width="4" height="11" fill="#2a2a2a" opacity="0.8"/>
    <!-- Nib -->
    <path d="M293,328 L313,331 L310,338 L293,338 Z" fill="#c8a840"/>
    <path d="M295,330 L312,332 L311,337 L296,337 Z" fill="#e8c850" opacity="0.6"/>
    <!-- Nib slit -->
    <line x1="302" y1="331" x2="311" y2="335" stroke="#8a7020" stroke-width="0.8" opacity="0.7"/>
    <!-- Pen sheen -->
    <rect x="162" y="326" width="135" height="3" rx="2" fill="#ffffff" opacity="0.08"/>
    <!-- Pen end cap -->
    <circle cx="162" cy="332" r="6" fill="#2a2a2a"/>
    <circle cx="160" cy="331" r="3" fill="#3a3a3a" opacity="0.7"/>
  </g>

  <!-- ============ SMALL SUCCULENT POT ============ -->
  <g filter="url(#potShadow)" transform="translate(440, 310)">
    <!-- Pot body -->
    <path d="M15,60 L10,100 Q25,108 40,100 L35,60 Z" fill="url(#potGrad)"/>
    <!-- Pot rim -->
    <ellipse cx="25" cy="60" rx="21" ry="7" fill="#c07848"/>
    <ellipse cx="25" cy="60" rx="21" ry="7" fill="none" stroke="#8b5e3c" stroke-width="1.5"/>
    <!-- Rim highlight -->
    <path d="M7,57 Q25,52 43,57" stroke="#d08860" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Pot base -->
    <ellipse cx="25" cy="100" rx="15" ry="5" fill="#8b5e3c"/>
    <!-- Soil in pot top -->
    <ellipse cx="25" cy="60" rx="18" ry="5.5" fill="#2a1408"/>
    <!-- Soil texture -->
    <circle cx="20" cy="59" r="2" fill="#1a0a05" opacity="0.6"/>
    <circle cx="30" cy="60" r="1.5" fill="#1a0a05" opacity="0.5"/>
    <circle cx="25" cy="62" r="1.8" fill="#1a0a05" opacity="0.55"/>
    <!-- Pot shadow line -->
    <path d="M15,62 L12,96" stroke="#6b4226" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Succulent rosette leaves -->
    <!-- Outer ring leaves -->
    <path d="M25,58 Q18,45 12,40 Q10,35 14,33 Q18,31 22,37 Q26,44 25,55 Z" fill="#7a9060"/>
    <path d="M25,58 Q33,46 38,40 Q41,35 37,33 Q33,31 29,37 Q25,44 25,55 Z" fill="#7a9060"/>
    <path d="M25,58 Q14,53 8,50 Q4,47 6,43 Q9,40 14,44 Q20,49 25,56 Z" fill="#8aaa70"/>
    <path d="M25,58 Q36,53 42,50 Q46,47 44,43 Q41,40 36,44 Q30,49 25,56 Z" fill="#8aaa70"/>
    <path d="M25,58 Q15,62 10,65 Q6,69 8,73 Q12,76 17,72 Q22,67 25,60 Z" fill="#7a9060"/>
    <path d="M25,58 Q35,62 40,65 Q44,69 42,73 Q38,76 33,72 Q28,67 25,60 Z" fill="#7a9060"/>
    <path d="M25,58 Q22,68 20,74 Q18,79 21,81 Q24,83 27,79 Q29,74 25,60 Z" fill="#8aaa70"/>
    <!-- Inner leaves -->
    <path d="M25,57 Q20,50 18,44 Q17,40 20,39 Q23,38 25,43 Q27,49 25,56 Z" fill="#9abc80"/>
    <path d="M25,57 Q30,50 32,44 Q33,40 30,39 Q27,38 25,43 Q23,49 25,56 Z" fill="#9abc80"/>
    <path d="M25,57 Q19,55 16,56 Q14,58 15,61 Q17,63 21,61 Q24,59 25,57 Z" fill="#aac890"/>
    <path d="M25,57 Q31,55 34,56 Q36,58 35,61 Q33,63 29,61 Q26,59 25,57 Z" fill="#aac890"/>
    <!-- Center bud -->
    <circle cx="25" cy="56" r="6" fill="#c0d8a0"/>
    <circle cx="25" cy="55" r="3.5" fill="#d0e8b0"/>
    <!-- Leaf vein details -->
    <path d="M25,57 L18,41" stroke="#6a8050" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M25,57 L32,41" stroke="#6a8050" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M25,57 L9,49" stroke="#6a8050" stroke-width="0.6" fill="none" opacity="0.45"/>
    <path d="M25,57 L41,49" stroke="#6a8050" stroke-width="0.6" fill="none" opacity="0.45"/>
  </g>

  <!-- ============ OBJECT SHADOWS ON DESK ============ -->
  <!-- Envelope shadow -->
  <ellipse cx="285" cy="433" rx="90" ry="10" fill="#2a1808" opacity="0.2" filter="url(#softBlur)"/>
  <!-- Pen shadow -->
  <ellipse cx="255" cy="430" rx="65" ry="6" fill="#2a1808" opacity="0.15"/>
  <!-- Pot shadow -->
  <ellipse cx="468" cy="428" rx="30" ry="7" fill="#2a1808" opacity="0.2"/>

  <!-- Additional ambient morning light pool on desk -->
  <ellipse cx="185" cy="355" rx="120" ry="40" fill="#fff8e8" opacity="0.18"/>

  <!-- ============ WALL CORNER / EDGE SHADOWS ============ -->
  <rect x="0" y="0" width="80" height="450" fill="#1a0f08" opacity="0.12"/>
  <rect x="520" y="0" width="80" height="450" fill="#1a0f08" opacity="0.1"/>
  <rect x="0" y="390" width="600" height="60" fill="#1a0f08" opacity="0.15"/>

  <!-- Subtle filter for softBlur reference -->
  <filter id="softBlur">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</svg>
