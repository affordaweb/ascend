<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-train" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e3a5f" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="room-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#room-bg)" rx="18"/>

  <!-- Floor line -->
  <rect x="30" y="390" width="540" height="45" rx="8" fill="#bfdbfe" opacity="0.5"/>

  <!-- Back wall -->
  <rect x="50" y="120" width="500" height="270" rx="8" fill="white" opacity="0.5"/>

  <!-- Presentation screen / board -->
  <rect x="145" y="100" width="280" height="185" rx="8" fill="#1e3a5f" filter="url(#shadow-train)"/>
  <rect x="152" y="108" width="266" height="169" rx="5" fill="url(#screen-grad)"/>

  <!-- Screen content: bar chart -->
  <rect x="170" y="230" width="22" height="35" rx="3" fill="#93c5fd" opacity="0.9"/>
  <rect x="198" y="210" width="22" height="55" rx="3" fill="#60a5fa" opacity="0.9"/>
  <rect x="226" y="190" width="22" height="75" rx="3" fill="#3b82f6" opacity="0.9"/>
  <rect x="254" y="175" width="22" height="90" rx="3" fill="#2563eb" opacity="0.9"/>
  <rect x="282" y="195" width="22" height="70" rx="3" fill="#fbbf24" opacity="0.9"/>
  <rect x="310" y="215" width="22" height="50" rx="3" fill="#f59e0b" opacity="0.9"/>
  <!-- Chart axis lines -->
  <line x1="162" y1="270" x2="342" y2="270" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="162" y1="270" x2="162" y2="118" stroke="white" stroke-width="2" opacity="0.5"/>

  <!-- Trend line on chart -->
  <path d="M170,240 L198,218 L226,196 L254,180 L282,200 L310,222" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Screen title bar -->
  <rect x="152" y="108" width="266" height="20" rx="5" fill="#0f172a" opacity="0.6"/>
  <text x="285" y="122" text-anchor="middle" font-family="Arial" font-size="9" fill="white" opacity="0.8">ESG Performance Dashboard</text>

  <!-- Presentation stand / easel -->
  <rect x="281" y="285" width="8" height="60" rx="3" fill="#1e3a5f"/>
  <line x1="270" y1="340" x2="300" y2="340" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="360" x2="275" y2="340" stroke="#1e3a5f" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="310" y1="360" x2="295" y2="340" stroke="#1e3a5f" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Presenter figure -->
  <circle cx="115" cy="255" r="20" fill="#fbbf24" filter="url(#shadow-train)"/>
  <!-- Presenter body -->
  <rect x="97" y="275" width="36" height="55" rx="8" fill="#1e3a5f"/>
  <!-- Pointer arm -->
  <path d="M125,285 Q148,270 158,265" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Pointer -->
  <line x1="158" y1="265" x2="175" y2="250" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="178" cy="248" r="4" fill="#f59e0b"/>
  <!-- Presenter legs -->
  <rect x="100" y="327" width="13" height="30" rx="5" fill="#1e3a5f"/>
  <rect x="120" y="327" width="13" height="30" rx="5" fill="#1e3a5f"/>
  <!-- Presenter feet -->
  <ellipse cx="107" cy="358" rx="10" ry="6" fill="#0f172a"/>
  <ellipse cx="127" cy="358" rx="10" ry="6" fill="#0f172a"/>

  <!-- Podium -->
  <rect x="83" y="348" width="64" height="42" rx="6" fill="#2563eb" filter="url(#shadow-train)"/>
  <rect x="88" y="355" width="54" height="28" rx="4" fill="#1e3a5f" opacity="0.5"/>
  <!-- Papers on podium -->
  <rect x="93" y="358" width="44" height="6" rx="2" fill="white" opacity="0.4"/>
  <rect x="93" y="367" width="35" height="4" rx="2" fill="white" opacity="0.3"/>

  <!-- Audience figure 1 -->
  <circle cx="385" cy="305" r="17" fill="#fbbf24"/>
  <rect x="369" y="322" width="32" height="45" rx="7" fill="#2563eb"/>
  <rect x="372" y="364" width="11" height="26" rx="4" fill="#2563eb"/>
  <rect x="387" y="364" width="11" height="26" rx="4" fill="#2563eb"/>
  <!-- Seat 1 -->
  <rect x="363" y="355" width="44" height="10" rx="4" fill="#93c5fd"/>
  <rect x="363" y="348" width="8" height="25" rx="3" fill="#93c5fd"/>
  <rect x="399" y="348" width="8" height="25" rx="3" fill="#93c5fd"/>

  <!-- Audience figure 2 -->
  <circle cx="455" cy="300" r="17" fill="#f59e0b"/>
  <rect x="439" y="317" width="32" height="45" rx="7" fill="#1e3a5f"/>
  <rect x="442" y="359" width="11" height="26" rx="4" fill="#1e3a5f"/>
  <rect x="457" y="359" width="11" height="26" rx="4" fill="#1e3a5f"/>
  <!-- Seat 2 -->
  <rect x="433" y="350" width="44" height="10" rx="4" fill="#93c5fd"/>
  <rect x="433" y="343" width="8" height="25" rx="3" fill="#93c5fd"/>
  <rect x="469" y="343" width="8" height="25" rx="3" fill="#93c5fd"/>

  <!-- Audience figure 3 -->
  <circle cx="525" cy="305" r="17" fill="#fbbf24"/>
  <rect x="509" y="322" width="32" height="45" rx="7" fill="#2563eb"/>
  <rect x="512" y="364" width="11" height="26" rx="4" fill="#2563eb"/>
  <rect x="527" y="364" width="11" height="26" rx="4" fill="#2563eb"/>
  <!-- Seat 3 -->
  <rect x="503" y="355" width="44" height="10" rx="4" fill="#93c5fd"/>
  <rect x="503" y="348" width="8" height="25" rx="3" fill="#93c5fd"/>
  <rect x="539" y="348" width="8" height="25" rx="3" fill="#93c5fd"/>

  <!-- Notebooks for audience -->
  <rect x="373" y="332" width="24" height="18" rx="3" fill="white" opacity="0.7"/>
  <line x1="376" y1="337" x2="394" y2="337" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>
  <line x1="376" y1="342" x2="394" y2="342" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>

  <rect x="443" y="327" width="24" height="18" rx="3" fill="white" opacity="0.7"/>
  <line x1="446" y1="332" x2="464" y2="332" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>
  <line x1="446" y1="337" x2="464" y2="337" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>

  <!-- Speech bubble with lightbulb -->
  <rect x="345" y="55" width="120" height="75" rx="14" fill="white" filter="url(#shadow-train)"/>
  <polygon points="380,130 370,145 395,130" fill="white"/>
  <!-- Lightbulb icon -->
  <circle cx="405" cy="85" r="20" fill="#fbbf24" opacity="0.9"/>
  <path d="M398,82 Q398,72 405,72 Q412,72 412,82 Q412,88 408,92 L402,92 Q398,88 398,82Z" fill="#1e3a5f"/>
  <rect x="401" y="92" width="8" height="5" rx="2" fill="#1e3a5f"/>
  <rect x="402" y="97" width="6" height="3" rx="1.5" fill="#1e3a5f"/>
  <!-- Rays around bulb -->
  <line x1="405" y1="60" x2="405" y2="56" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="420" y1="65" x2="424" y2="62" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="425" y1="80" x2="429" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="390" y1="65" x2="386" y2="62" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="385" y1="80" x2="381" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Text lines in bubble -->
  <line x1="360" y1="80" x2="384" y2="80" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>
  <line x1="360" y1="90" x2="384" y2="90" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>
  <line x1="360" y1="100" x2="375" y2="100" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>
  <line x1="360" y1="110" x2="382" y2="110" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>

  <!-- Decorative circles -->
  <circle cx="55" cy="60" r="30" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="555" cy="55" r="25" fill="#fef3c7" opacity="0.5"/>
  <circle cx="560" cy="400" r="32" fill="#bfdbfe" opacity="0.35"/>
</svg>
