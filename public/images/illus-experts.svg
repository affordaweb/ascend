<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-exp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e3a5f" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="exp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="badge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#exp-bg)" rx="18"/>

  <!-- Background decoration -->
  <circle cx="60" cy="70" r="50" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="540" cy="80" r="45" fill="#fef3c7" opacity="0.4"/>
  <circle cx="300" cy="420" r="55" fill="#bfdbfe" opacity="0.3"/>

  <!-- Connecting line between figures (friendship/team) -->
  <path d="M158,280 Q225,295 300,295 Q375,295 442,280" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" fill="none" opacity="0.4"/>

  <!-- === EXPERT 1 (Left) === -->
  <g transform="translate(130,200)">
    <!-- Card background -->
    <rect x="-65" y="-15" width="130" height="185" rx="12" fill="url(#card-grad)" filter="url(#shadow-exp)"/>
    <rect x="-65" y="-15" width="130" height="55" rx="12" fill="#1e3a5f"/>
    <rect x="-65" y="25" width="130" height="15" fill="#1e3a5f"/>
    <!-- Avatar -->
    <circle r="35" fill="#fbbf24"/>
    <!-- Hair -->
    <path d="M-22,-28 Q0,-42 22,-28 Q28,-18 25,-8 Q12,-15 0,-15 Q-12,-15 -25,-8 Q-28,-18 -22,-28Z" fill="#92400e"/>
    <!-- Face features -->
    <ellipse cx="-10" cy="-5" rx="4" ry="5" fill="white"/>
    <ellipse cx="10" cy="-5" rx="4" ry="5" fill="white"/>
    <circle cx="-10" cy="-4" r="2.5" fill="#1e3a5f"/>
    <circle cx="10" cy="-4" r="2.5" fill="#1e3a5f"/>
    <path d="M-8,10 Q0,16 8,10" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-30" y="36" width="60" height="75" rx="8" fill="#2563eb"/>
    <!-- Collar/tie -->
    <path d="M-8,36 L0,52 L8,36" fill="#1e3a5f"/>
    <rect x="-3" y="48" width="6" height="25" rx="3" fill="#1e3a5f"/>
    <!-- Legs -->
    <rect x="-22" y="108" width="18" height="32" rx="6" fill="#1e3a5f"/>
    <rect x="4" y="108" width="18" height="32" rx="6" fill="#1e3a5f"/>
    <!-- Shoes -->
    <ellipse cx="-13" cy="141" rx="12" ry="6" fill="#0f172a"/>
    <ellipse cx="13" cy="141" rx="12" ry="6" fill="#0f172a"/>
    <!-- Name plate -->
    <rect x="-50" y="145" width="100" height="20" rx="5" fill="#1e3a5f"/>
    <rect x="-38" y="150" width="76" height="5" rx="2" fill="#93c5fd" opacity="0.6"/>
    <rect x="-25" y="158" width="50" height="4" rx="2" fill="#93c5fd" opacity="0.4"/>
  </g>
  <!-- Star badge for expert 1 -->
  <g transform="translate(130,90)" filter="url(#shadow-exp)">
    <circle r="24" fill="url(#badge1)"/>
    <polygon points="0,-14 3.5,-5 13,-5 5.5,1 8.5,11 0,5.5 -8.5,11 -5.5,1 -13,-5 -3.5,-5" fill="white"/>
  </g>
  <!-- Expert 1 label -->
  <text x="130" y="368" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a5f">ESG Lead</text>

  <!-- === EXPERT 2 (Center) === -->
  <g transform="translate(300,185)">
    <!-- Card (slightly taller = lead expert) -->
    <rect x="-70" y="-18" width="140" height="200" rx="14" fill="url(#card-grad)" filter="url(#shadow-exp)"/>
    <rect x="-70" y="-18" width="140" height="60" rx="14" fill="#2563eb"/>
    <rect x="-70" y="26" width="140" height="16" fill="#2563eb"/>
    <!-- Avatar (slightly larger) -->
    <circle r="38" fill="#f59e0b"/>
    <!-- Hair -->
    <path d="M-25,-30 Q0,-46 25,-30 Q30,-18 27,-6 Q13,-16 0,-16 Q-13,-16 -27,-6 Q-30,-18 -25,-30Z" fill="#1e3a5f"/>
    <!-- Face features -->
    <ellipse cx="-12" cy="-4" rx="4.5" ry="5.5" fill="white"/>
    <ellipse cx="12" cy="-4" rx="4.5" ry="5.5" fill="white"/>
    <circle cx="-12" cy="-3" r="2.8" fill="#1e3a5f"/>
    <circle cx="12" cy="-3" r="2.8" fill="#1e3a5f"/>
    <path d="M-9,12 Q0,19 9,12" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Glasses -->
    <rect x="-18" y="-9" width="13" height="10" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="5" y="-9" width="13" height="10" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- Body -->
    <rect x="-34" y="40" width="68" height="85" rx="9" fill="#1e3a5f"/>
    <!-- Collar/blazer -->
    <path d="M-12,40 L0,58 L12,40" fill="#2563eb"/>
    <rect x="-4" y="55" width="8" height="28" rx="4" fill="#2563eb"/>
    <!-- Lapels -->
    <path d="M-12,40 L-20,65 L-10,55" fill="#0f172a" opacity="0.4"/>
    <path d="M12,40 L20,65 L10,55" fill="#0f172a" opacity="0.4"/>
    <!-- Legs -->
    <rect x="-24" y="122" width="20" height="34" rx="6" fill="#0f172a"/>
    <rect x="4" y="122" width="20" height="34" rx="6" fill="#0f172a"/>
    <!-- Shoes -->
    <ellipse cx="-14" cy="157" rx="13" ry="7" fill="#0f172a"/>
    <ellipse cx="14" cy="157" rx="13" ry="7" fill="#0f172a"/>
    <!-- Name plate -->
    <rect x="-55" y="161" width="110" height="22" rx="5" fill="#1e3a5f"/>
    <rect x="-42" y="167" width="84" height="5" rx="2" fill="#fbbf24" opacity="0.7"/>
    <rect x="-28" y="175" width="56" height="4" rx="2" fill="#93c5fd" opacity="0.5"/>
  </g>
  <!-- Star badge for expert 2 (bigger, gold) -->
  <g transform="translate(300,72)" filter="url(#shadow-exp)">
    <circle r="28" fill="#f59e0b"/>
    <circle r="24" fill="#fbbf24"/>
    <polygon points="0,-16 4,-6 15,-6 7,1 10,13 0,6 -10,13 -7,1 -15,-6 -4,-6" fill="white"/>
    <!-- Extra sparkle -->
    <circle r="28" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
  </g>
  <text x="300" y="377" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2563eb">Senior Director</text>

  <!-- === EXPERT 3 (Right) === -->
  <g transform="translate(470,200)">
    <!-- Card background -->
    <rect x="-65" y="-15" width="130" height="185" rx="12" fill="url(#card-grad)" filter="url(#shadow-exp)"/>
    <rect x="-65" y="-15" width="130" height="55" rx="12" fill="#1e3a5f"/>
    <rect x="-65" y="25" width="130" height="15" fill="#1e3a5f"/>
    <!-- Avatar -->
    <circle r="35" fill="#fbbf24"/>
    <!-- Hair (different style) -->
    <path d="M-22,-28 Q-5,-45 22,-28 Q28,-18 25,-8 Q12,-16 0,-16 Q-12,-16 -25,-8 Q-28,-18 -22,-28Z" fill="#44403c"/>
    <!-- Face features -->
    <ellipse cx="-10" cy="-5" rx="4" ry="5" fill="white"/>
    <ellipse cx="10" cy="-5" rx="4" ry="5" fill="white"/>
    <circle cx="-10" cy="-4" r="2.5" fill="#1e3a5f"/>
    <circle cx="10" cy="-4" r="2.5" fill="#1e3a5f"/>
    <path d="M-7,10 Q0,15 7,10" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-30" y="36" width="60" height="75" rx="8" fill="#2563eb"/>
    <!-- Badge/ID on chest -->
    <rect x="-8" y="48" width="18" height="22" rx="3" fill="white" opacity="0.8"/>
    <rect x="-5" y="53" width="12" height="3" rx="1" fill="#93c5fd"/>
    <rect x="-5" y="59" width="9" height="2" rx="1" fill="#93c5fd" opacity="0.6"/>
    <rect x="-5" y="63" width="10" height="2" rx="1" fill="#93c5fd" opacity="0.5"/>
    <!-- Legs -->
    <rect x="-22" y="108" width="18" height="32" rx="6" fill="#1e3a5f"/>
    <rect x="4" y="108" width="18" height="32" rx="6" fill="#1e3a5f"/>
    <!-- Shoes -->
    <ellipse cx="-13" cy="141" rx="12" ry="6" fill="#0f172a"/>
    <ellipse cx="13" cy="141" rx="12" ry="6" fill="#0f172a"/>
    <!-- Name plate -->
    <rect x="-50" y="145" width="100" height="20" rx="5" fill="#1e3a5f"/>
    <rect x="-38" y="150" width="76" height="5" rx="2" fill="#93c5fd" opacity="0.6"/>
    <rect x="-25" y="158" width="50" height="4" rx="2" fill="#93c5fd" opacity="0.4"/>
  </g>
  <!-- Star badge for expert 3 -->
  <g transform="translate(470,90)" filter="url(#shadow-exp)">
    <circle r="24" fill="url(#badge1)"/>
    <polygon points="0,-14 3.5,-5 13,-5 5.5,1 8.5,11 0,5.5 -8.5,11 -5.5,1 -13,-5 -3.5,-5" fill="white"/>
  </g>
  <!-- Expert 3 label -->
  <text x="470" y="368" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1e3a5f">Analyst</text>

  <!-- Handshake in foreground -->
  <g transform="translate(300,415)" filter="url(#shadow-exp)">
    <!-- Left hand/arm -->
    <path d="M-90,0 Q-60,-12 -30,-8 L-15,-5 Q-5,-3 0,0" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right hand/arm -->
    <path d="M90,0 Q60,-12 30,-8 L15,-5 Q5,-3 0,0" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Clasped hands center -->
    <ellipse cx="0" cy="0" rx="30" ry="18" fill="#fbbf24"/>
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="#f59e0b"/>
    <!-- Knuckle details -->
    <path d="M-18,-4 Q-10,-10 0,-8 Q10,-10 18,-4" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <!-- Floating small stars -->
  <path d="M55,180 L57,186 L63,186 L58,190 L60,196 L55,192 L50,196 L52,190 L47,186 L53,186Z" fill="#fbbf24" opacity="0.7"/>
  <path d="M540,180 L542,185 L547,185 L543,189 L545,194 L540,191 L535,194 L537,189 L533,185 L538,185Z" fill="#fbbf24" opacity="0.7"/>
  <path d="M300,40 L302,46 L308,46 L303,50 L305,56 L300,52 L295,56 L297,50 L292,46 L298,46Z" fill="#f59e0b" opacity="0.6"/>
</svg>
