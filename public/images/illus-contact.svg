<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-con" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="con-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="envelope-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#con-bg)" rx="18"/>

  <!-- Abstract map grid in background -->
  <g opacity="0.12" stroke="#2563eb" stroke-width="1.2">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="75" y1="0" x2="75" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="225" y1="0" x2="225" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="375" y1="0" x2="375" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="525" y1="0" x2="525" y2="450"/>
  </g>

  <!-- Map landmark dots -->
  <circle cx="150" cy="150" r="5" fill="#2563eb" opacity="0.2"/>
  <circle cx="225" cy="225" r="4" fill="#2563eb" opacity="0.15"/>
  <circle cx="450" cy="300" r="5" fill="#2563eb" opacity="0.2"/>
  <circle cx="375" cy="150" r="4" fill="#2563eb" opacity="0.18"/>
  <circle cx="525" cy="225" r="4" fill="#2563eb" opacity="0.15"/>

  <!-- Connection lines between elements -->
  <path d="M210,290 Q195,240 180,195" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.5"/>
  <path d="M370,290 Q380,240 400,195" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.5"/>
  <circle cx="210" cy="290" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="370" cy="290" r="5" fill="#fbbf24" opacity="0.8"/>

  <!-- Large envelope -->
  <g transform="translate(300,265)" filter="url(#shadow-con)">
    <!-- Envelope body -->
    <rect x="-130" y="-80" width="260" height="180" rx="12" fill="url(#envelope-grad)"/>
    <!-- Envelope flap (open) -->
    <path d="M-130,-80 L0,-170 L130,-80" fill="#1e3a5f" opacity="0.85"/>
    <!-- Envelope flap inner highlight -->
    <path d="M-110,-80 L0,-152 L110,-80" fill="#2563eb" opacity="0.4"/>
    <!-- Envelope bottom fold lines -->
    <line x1="-130" y1="100" x2="0" y2="20" stroke="white" stroke-width="1.5" opacity="0.2"/>
    <line x1="130" y1="100" x2="0" y2="20" stroke="white" stroke-width="1.5" opacity="0.2"/>

    <!-- Letter coming out of envelope -->
    <rect x="-75" y="-130" width="150" height="130" rx="8" fill="url(#letter-grad)" filter="url(#shadow-con)"/>
    <!-- Letter lines -->
    <rect x="-55" y="-115" width="110" height="8" rx="3" fill="#bfdbfe"/>
    <rect x="-55" y="-100" width="90" height="6" rx="2" fill="#dbeafe"/>
    <rect x="-55" y="-88" width="100" height="6" rx="2" fill="#dbeafe"/>
    <rect x="-55" y="-76" width="85" height="6" rx="2" fill="#dbeafe"/>
    <rect x="-55" y="-64" width="95" height="6" rx="2" fill="#dbeafe"/>
    <rect x="-55" y="-52" width="70" height="6" rx="2" fill="#dbeafe"/>
    <!-- Logo/stamp on letter -->
    <circle cx="45" cy="-22" r="18" fill="#fbbf24" opacity="0.8"/>
    <text x="45" y="-18" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#1e3a5f">IMG</text>
  </g>

  <!-- Phone handset (left) -->
  <g transform="translate(130,220)" filter="url(#shadow-con)">
    <rect x="-28" y="-55" width="56" height="110" rx="18" fill="#1e3a5f"/>
    <!-- Phone screen -->
    <rect x="-20" y="-40" width="40" height="70" rx="6" fill="#dbeafe"/>
    <!-- Signal waves -->
    <path d="M-30,-72 Q-45,-80 -42,-95 Q-28,-88 -30,-72Z" fill="#2563eb" opacity="0.4"/>
    <path d="M30,-72 Q45,-80 42,-95 Q28,-88 30,-72Z" fill="#2563eb" opacity="0.4"/>
    <!-- Phone earpiece -->
    <rect x="-10" y="-48" width="20" height="5" rx="2" fill="#93c5fd" opacity="0.7"/>
    <!-- Home button -->
    <circle cx="0" cy="45" r="7" fill="#93c5fd" opacity="0.5"/>
    <!-- Screen content -->
    <circle cx="0" cy="-12" r="12" fill="#2563eb" opacity="0.4"/>
    <line x1="-12" y1="8" x2="12" y2="8" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
    <line x1="-8" y1="15" x2="8" y2="15" stroke="#93c5fd" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Phone label -->
  <text x="130" y="325" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e3a5f" opacity="0.7">Call Us</text>

  <!-- Location pin (right) -->
  <g transform="translate(470,215)" filter="url(#shadow-con)">
    <!-- Pin body -->
    <path d="M0,-70 Q40,-70 40,-30 Q40,10 0,50 Q-40,10 -40,-30 Q-40,-70 0,-70Z" fill="#f59e0b"/>
    <!-- Pin hole -->
    <circle cx="0" cy="-20" r="18" fill="white"/>
    <circle cx="0" cy="-20" r="10" fill="#f59e0b"/>
    <!-- Pin shadow tip -->
    <ellipse cx="0" cy="52" rx="12" ry="5" fill="#1e3a5f" opacity="0.2"/>
  </g>
  <!-- Pin label -->
  <text x="470" y="325" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e3a5f" opacity="0.7">Find Us</text>

  <!-- Connection line dots -->
  <circle cx="168" cy="220" r="6" fill="#2563eb" opacity="0.6"/>
  <circle cx="300" cy="185" r="6" fill="#2563eb" opacity="0.6"/>
  <circle cx="432" cy="220" r="6" fill="#2563eb" opacity="0.6"/>

  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="30" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="540" cy="60" r="25" fill="#fef3c7" opacity="0.5"/>
  <circle cx="55" cy="400" r="28" fill="#bfdbfe" opacity="0.35"/>
  <circle cx="545" cy="395" r="32" fill="#fef3c7" opacity="0.35"/>

  <!-- Email icon floating -->
  <g transform="translate(300,55)" filter="url(#shadow-con)">
    <rect x="-30" y="-18" width="60" height="40" rx="6" fill="#2563eb"/>
    <path d="M-30,-18 L0,8 L30,-18" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Bottom: social/contact icons row -->
  <g opacity="0.6">
    <circle cx="220" cy="415" r="14" fill="#2563eb"/>
    <text x="220" y="420" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="white">@</text>

    <circle cx="270" cy="415" r="14" fill="#1e3a5f"/>
    <line x1="262" y1="415" x2="278" y2="415" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="270" y1="407" x2="270" y2="423" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="320" cy="415" r="14" fill="#2563eb"/>
    <rect x="313" y="408" width="14" height="14" rx="4" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="320" cy="415" r="3" fill="none" stroke="white" stroke-width="1.5"/>

    <circle cx="370" cy="415" r="14" fill="#1e3a5f"/>
    <rect x="362" y="409" width="16" height="12" rx="3" fill="none" stroke="white" stroke-width="2"/>
    <path d="M362,409 L370,416 L378,409" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
