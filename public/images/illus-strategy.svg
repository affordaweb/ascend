<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-strat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e3a5f" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="target-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#target-bg)" rx="18"/>

  <!-- Decorative dots pattern -->
  <circle cx="50" cy="50" r="4" fill="#bfdbfe" opacity="0.8"/>
  <circle cx="80" cy="50" r="4" fill="#bfdbfe" opacity="0.6"/>
  <circle cx="110" cy="50" r="4" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="50" cy="80" r="4" fill="#bfdbfe" opacity="0.6"/>
  <circle cx="80" cy="80" r="4" fill="#bfdbfe" opacity="0.8"/>
  <circle cx="110" cy="80" r="4" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="50" cy="110" r="4" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="80" cy="110" r="4" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="110" cy="110" r="4" fill="#bfdbfe" opacity="0.7"/>

  <!-- Bar chart in background (right side) -->
  <rect x="410" y="300" width="28" height="100" rx="4" fill="#bfdbfe" opacity="0.7"/>
  <rect x="448" y="255" width="28" height="145" rx="4" fill="#93c5fd" opacity="0.7"/>
  <rect x="486" y="218" width="28" height="182" rx="4" fill="#60a5fa" opacity="0.7"/>
  <rect x="524" y="175" width="28" height="225" rx="4" fill="#2563eb" opacity="0.75"/>
  <!-- Bar chart baseline -->
  <rect x="405" y="398" width="155" height="4" rx="2" fill="#1e3a5f" opacity="0.3"/>

  <!-- Upward trend arrow on chart -->
  <path d="M420,290 L450,248 L488,210 L526,168" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="none"/>
  <circle cx="420" cy="290" r="5" fill="#f59e0b"/>
  <circle cx="450" cy="248" r="5" fill="#f59e0b"/>
  <circle cx="488" cy="210" r="5" fill="#f59e0b"/>
  <circle cx="526" cy="168" r="5" fill="#f59e0b"/>

  <!-- Compass rose (top left) -->
  <g transform="translate(80,90)">
    <circle r="36" fill="white" opacity="0.85" filter="url(#shadow-strat)"/>
    <circle r="28" fill="#dbeafe"/>
    <circle r="8" fill="#1e3a5f"/>
    <!-- N arrow -->
    <polygon points="0,-28 -5,-10 0,-14 5,-10" fill="#1e3a5f"/>
    <!-- S arrow -->
    <polygon points="0,28 -5,10 0,14 5,10" fill="#93c5fd"/>
    <!-- E arrow -->
    <polygon points="28,0 10,-5 14,0 10,5" fill="#93c5fd"/>
    <!-- W arrow -->
    <polygon points="-28,0 -10,-5 -14,0 -10,5" fill="#93c5fd"/>
    <!-- N label -->
    <text x="0" y="-32" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#1e3a5f">N</text>
    <!-- Degree marks -->
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(45)"/>
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(90)"/>
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(135)"/>
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(180)"/>
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(225)"/>
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(270)"/>
    <line x1="0" y1="-20" x2="0" y2="-24" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" transform="rotate(315)"/>
  </g>

  <!-- Large bullseye / target -->
  <circle cx="248" cy="235" r="130" fill="#e0e7ff" opacity="0.5" filter="url(#shadow-strat)"/>
  <circle cx="248" cy="235" r="130" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  <circle cx="248" cy="235" r="105" fill="#dbeafe"/>
  <circle cx="248" cy="235" r="105" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="248" cy="235" r="80" fill="#bfdbfe"/>
  <circle cx="248" cy="235" r="80" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <circle cx="248" cy="235" r="55" fill="#93c5fd"/>
  <circle cx="248" cy="235" r="55" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="248" cy="235" r="30" fill="#2563eb"/>
  <circle cx="248" cy="235" r="30" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <!-- Bullseye center -->
  <circle cx="248" cy="235" r="12" fill="#1e3a5f"/>
  <circle cx="248" cy="235" r="5" fill="white"/>

  <!-- Arrow hitting center -->
  <line x1="155" y1="142" x2="242" y2="232" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <polygon points="248,235 228,220 238,228 228,212" fill="#f59e0b" transform="rotate(45,248,235)"/>
  <!-- Arrow fletching -->
  <line x1="155" y1="142" x2="163" y2="158" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="142" x2="171" y2="150" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Arrowhead proper -->
  <polygon points="248,232 238,214 244,226 230,214" fill="#f59e0b"/>

  <!-- Hand pointing figure -->
  <!-- Arm/hand -->
  <path d="M95,320 Q115,295 140,275 Q160,258 175,250" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Hand shape -->
  <ellipse cx="182" cy="246" rx="18" ry="12" fill="#fbbf24" transform="rotate(-30,182,246)"/>
  <rect x="192" y="232" width="8" height="22" rx="4" fill="#fbbf24" transform="rotate(-30,196,243)"/>
  <rect x="202" y="236" width="8" height="18" rx="4" fill="#fbbf24" transform="rotate(-15,206,245)"/>
  <rect x="210" y="242" width="8" height="16" rx="4" fill="#fbbf24" transform="rotate(0,214,250)"/>
  <!-- Pointing finger -->
  <rect x="185" y="225" width="9" height="26" rx="4.5" fill="#fbbf24" transform="rotate(-45,189,238)"/>
  <!-- Body behind arm -->
  <ellipse cx="85" cy="340" rx="30" ry="20" fill="#1e3a5f" opacity="0.8"/>
  <circle cx="85" cy="310" r="18" fill="#fbbf24"/>
  <rect x="65" y="328" width="40" height="55" rx="8" fill="#2563eb"/>

  <!-- Small stars/sparkles -->
  <path d="M365,100 L368,108 L376,108 L370,114 L372,122 L365,117 L358,122 L360,114 L354,108 L362,108Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M395,65 L397,71 L403,71 L398,75 L400,81 L395,77 L390,81 L392,75 L387,71 L393,71Z" fill="#f59e0b" opacity="0.7"/>

  <!-- Crosshair lines on target -->
  <line x1="248" y1="105" x2="248" y2="365" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
  <line x1="118" y1="235" x2="378" y2="235" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
</svg>
