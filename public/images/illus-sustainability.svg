<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-sus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a5f" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="450" fill="url(#sky)" rx="18"/>

  <!-- Sun -->
  <circle cx="300" cy="115" r="58" fill="#fef9c3" opacity="0.5" filter="url(#shadow-sus)"/>
  <circle cx="300" cy="115" r="48" fill="url(#sun-glow)" filter="url(#shadow-sus)"/>
  <!-- Sun rays -->
  <line x1="300" y1="42" x2="300" y2="28" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="188" x2="300" y2="202" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="227" y1="115" x2="213" y2="115" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="373" y1="115" x2="387" y2="115" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="63" x2="238" y2="53" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="352" y1="167" x2="362" y2="177" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="352" y1="63" x2="362" y2="53" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="248" y1="167" x2="238" y2="177" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <!-- Sun inner -->
  <circle cx="300" cy="115" r="30" fill="#f59e0b"/>
  <circle cx="285" cy="102" r="8" fill="#fef3c7" opacity="0.35"/>

  <!-- Clouds -->
  <g filter="url(#shadow-sus)">
    <ellipse cx="95" cy="100" rx="42" ry="22" fill="white" opacity="0.92"/>
    <ellipse cx="125" cy="88" rx="30" ry="20" fill="white" opacity="0.92"/>
    <ellipse cx="68" cy="95" rx="25" ry="17" fill="white" opacity="0.85"/>
  </g>
  <g filter="url(#shadow-sus)">
    <ellipse cx="490" cy="80" rx="38" ry="20" fill="white" opacity="0.88"/>
    <ellipse cx="516" cy="68" rx="26" ry="18" fill="white" opacity="0.88"/>
    <ellipse cx="464" cy="75" rx="22" ry="15" fill="white" opacity="0.82"/>
  </g>

  <!-- Rolling hills background (far) -->
  <path d="M0,310 Q80,250 160,280 Q240,310 320,260 Q400,210 480,250 Q540,278 600,240 L600,450 L0,450Z" fill="#86efac" opacity="0.5"/>
  <!-- Rolling hills midground -->
  <path d="M0,340 Q100,290 200,320 Q300,350 400,300 Q480,262 600,310 L600,450 L0,450Z" fill="url(#hill2)"/>
  <!-- Rolling hills foreground -->
  <path d="M0,380 Q120,340 240,370 Q360,400 480,355 Q540,332 600,355 L600,450 L0,450Z" fill="url(#hill1)"/>

  <!-- Ground -->
  <rect x="0" y="415" width="600" height="35" rx="0" fill="#16a34a"/>

  <!-- Wind turbine (left) -->
  <g transform="translate(120,300)">
    <!-- Tower -->
    <polygon points="-8,0 8,0 4,-140 -4,-140" fill="#e2e8f0"/>
    <!-- Nacelle -->
    <ellipse cx="0" cy="-140" rx="14" ry="8" fill="#cbd5e1"/>
    <!-- Blades -->
    <g transform="rotate(0,0,-140)">
      <path d="M0,-140 Q8,-175 0,-200 Q-5,-175 0,-140Z" fill="white" opacity="0.9"/>
    </g>
    <g transform="rotate(120,0,-140)">
      <path d="M0,-140 Q8,-175 0,-200 Q-5,-175 0,-140Z" fill="white" opacity="0.9"/>
    </g>
    <g transform="rotate(240,0,-140)">
      <path d="M0,-140 Q8,-175 0,-200 Q-5,-175 0,-140Z" fill="white" opacity="0.9"/>
    </g>
    <!-- Hub -->
    <circle cx="0" cy="-140" r="7" fill="#94a3b8"/>
    <!-- Base -->
    <ellipse cx="0" cy="2" rx="18" ry="8" fill="#94a3b8" opacity="0.5"/>
  </g>

  <!-- Wind turbine (right, smaller/further) -->
  <g transform="translate(490,320)">
    <polygon points="-6,0 6,0 3,-110 -3,-110" fill="#e2e8f0" opacity="0.8"/>
    <ellipse cx="0" cy="-110" rx="11" ry="6" fill="#cbd5e1" opacity="0.8"/>
    <g transform="rotate(30,0,-110)">
      <path d="M0,-110 Q6,-138 0,-158 Q-4,-138 0,-110Z" fill="white" opacity="0.75"/>
    </g>
    <g transform="rotate(150,0,-110)">
      <path d="M0,-110 Q6,-138 0,-158 Q-4,-138 0,-110Z" fill="white" opacity="0.75"/>
    </g>
    <g transform="rotate(270,0,-110)">
      <path d="M0,-110 Q6,-138 0,-158 Q-4,-138 0,-110Z" fill="white" opacity="0.75"/>
    </g>
    <circle cx="0" cy="-110" r="5" fill="#94a3b8" opacity="0.8"/>
  </g>

  <!-- Solar panels -->
  <g transform="translate(290,360)">
    <!-- Panel array -->
    <rect x="-85" y="-28" width="170" height="55" rx="4" fill="#1e3a5f" filter="url(#shadow-sus)"/>
    <!-- Panel grid lines -->
    <line x1="-57" y1="-28" x2="-57" y2="27" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-28" y1="-28" x2="-28" y2="27" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="1" y1="-28" x2="1" y2="27" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="-28" x2="30" y2="27" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="58" y1="-28" x2="58" y2="27" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-85" y1="-9" x2="85" y2="-9" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-85" y1="10" x2="85" y2="10" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <!-- Panel shine -->
    <rect x="-83" y="-26" width="165" height="22" rx="2" fill="white" opacity="0.05"/>
    <!-- Support legs -->
    <line x1="-60" y1="27" x2="-50" y2="45" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="27" x2="50" y2="45" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-60" y1="27" x2="-70" y2="45" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="27" x2="70" y2="45" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Trees (left cluster) -->
  <g transform="translate(55,370)">
    <!-- Tree 1 -->
    <rect x="-5" y="-30" width="10" height="35" rx="3" fill="#92400e"/>
    <ellipse cx="0" cy="-38" rx="22" ry="26" fill="#16a34a"/>
    <ellipse cx="-6" cy="-48" rx="16" ry="18" fill="#22c55e"/>
    <!-- Tree 2 -->
    <rect x="28" y="-22" width="8" height="27" rx="3" fill="#92400e"/>
    <ellipse cx="32" cy="-28" rx="18" ry="20" fill="#15803d"/>
    <ellipse cx="26" cy="-36" rx="12" ry="15" fill="#16a34a"/>
  </g>

  <!-- Trees (right cluster) -->
  <g transform="translate(535,365)">
    <rect x="-5" y="-28" width="10" height="32" rx="3" fill="#92400e"/>
    <ellipse cx="0" cy="-36" rx="20" ry="24" fill="#16a34a"/>
    <ellipse cx="-5" cy="-46" rx="14" ry="16" fill="#22c55e"/>
    <rect x="-32" y="-20" width="8" height="24" rx="3" fill="#92400e"/>
    <ellipse cx="-28" cy="-26" rx="16" ry="18" fill="#15803d"/>
  </g>

  <!-- Leaf decorations floating -->
  <path d="M190,195 Q210,178 225,192 Q210,210 190,195Z" fill="#4ade80" opacity="0.85" filter="url(#shadow-sus)"/>
  <path d="M198,194 Q210,186 198,206" stroke="#16a34a" stroke-width="1.5" fill="none" opacity="0.7"/>

  <path d="M370,185 Q392,168 408,183 Q392,200 370,185Z" fill="#4ade80" opacity="0.8" filter="url(#shadow-sus)"/>
  <path d="M378,184 Q392,176 378,196" stroke="#16a34a" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Sun energy connection lines -->
  <line x1="260" y1="148" x2="210" y2="330" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.3"/>
  <line x1="300" y1="163" x2="300" y2="332" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.3"/>
  <line x1="340" y1="148" x2="385" y2="330" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.3"/>

  <!-- Small birds in sky -->
  <path d="M155,160 Q162,155 170,160" stroke="#1e3a5f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M170,153 Q177,148 184,153" stroke="#1e3a5f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M410,145 Q417,140 424,145" stroke="#1e3a5f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
