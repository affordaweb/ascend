<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <!-- Dawn sky gradient (top to bottom) -->
    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0820"/>
      <stop offset="22%" stop-color="#1a1030"/>
      <stop offset="42%" stop-color="#2a1a3a"/>
      <stop offset="62%" stop-color="#5a2a18"/>
      <stop offset="78%" stop-color="#8b4010"/>
      <stop offset="90%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Sun/horizon glow radial -->
    <radialGradient id="sunGlow" cx="72%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#fdf0d5" stop-opacity="0.85"/>
      <stop offset="15%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#8b4010" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a1a3a" stop-opacity="0"/>
    </radialGradient>
    <!-- Far mountain gradient (dark navy) -->
    <linearGradient id="farMtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2040"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <!-- Mid mountain gradient (dark slate) -->
    <linearGradient id="midMtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1828"/>
      <stop offset="100%" stop-color="#0f1020"/>
    </linearGradient>
    <!-- Near peak gradient (dark with golden tip) -->
    <linearGradient id="nearPeakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a020"/>
      <stop offset="8%" stop-color="#c8751a"/>
      <stop offset="22%" stop-color="#2a1810"/>
      <stop offset="50%" stop-color="#1a1218"/>
      <stop offset="100%" stop-color="#0f0c14"/>
    </linearGradient>
    <!-- Gold-lit summit face -->
    <linearGradient id="summitGold" x1="0.6" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.70"/>
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.40"/>
      <stop offset="70%" stop-color="#6b2a0a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1218" stop-opacity="0"/>
    </linearGradient>
    <!-- Cloud gradient -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d8c8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c8b8a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a09080" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Valley shadow gradient -->
    <linearGradient id="valleyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0c1a"/>
      <stop offset="100%" stop-color="#060408"/>
    </linearGradient>
    <!-- Stone gradient -->
    <linearGradient id="stoneGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6b6060"/>
      <stop offset="40%" stop-color="#4a4040"/>
      <stop offset="100%" stop-color="#2a2828"/>
    </linearGradient>
    <!-- Light stone face (sun-lit side) -->
    <linearGradient id="stoneLit" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b090"/>
      <stop offset="50%" stop-color="#8b7060"/>
      <stop offset="100%" stop-color="#5a4840"/>
    </linearGradient>
    <!-- Light ray filter -->
    <filter id="rayFilter">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Cloud glow filter -->
    <filter id="cloudGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Summit glow filter -->
    <filter id="peakGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="-2" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
    <!-- Cairn shadow -->
    <filter id="cairnShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <!-- Star glow -->
    <filter id="starFilter">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- DAWN SKY BACKGROUND -->
  <rect width="600" height="450" fill="url(#dawnSky)"/>

  <!-- SUN / HORIZON RADIAL GLOW (behind clouds right side) -->
  <ellipse cx="435" cy="450" rx="320" ry="250" fill="url(#sunGlow)"/>
  <!-- Secondary warmer glow -->
  <ellipse cx="460" cy="450" rx="200" ry="160" fill="#d97706" opacity="0.18"/>

  <!-- LIGHT RAYS (subtle, radiating from sun position upper right behind peaks) -->
  <g opacity="0.08" filter="url(#rayFilter)">
    <line x1="480" y1="310" x2="600" y2="0" stroke="#fdf0d5" stroke-width="30"/>
    <line x1="480" y1="310" x2="520" y2="0" stroke="#fdf0d5" stroke-width="25"/>
    <line x1="480" y1="310" x2="600" y2="100" stroke="#fdf0d5" stroke-width="20"/>
    <line x1="480" y1="310" x2="350" y2="0" stroke="#fdf0d5" stroke-width="18"/>
    <line x1="480" y1="310" x2="600" y2="180" stroke="#fdf0d5" stroke-width="15"/>
    <line x1="480" y1="310" x2="200" y2="0" stroke="#f59e0b" stroke-width="14"/>
    <line x1="480" y1="310" x2="600" y2="260" stroke="#f59e0b" stroke-width="12"/>
    <line x1="480" y1="310" x2="100" y2="0" stroke="#f59e0b" stroke-width="10"/>
  </g>

  <!-- STARS (top of sky, fading at dawn) -->
  <g filter="url(#starFilter)">
    <circle cx="30" cy="18" r="1.5" fill="#c8d0e8" opacity="0.60"/>
    <circle cx="75" cy="10" r="1.2" fill="#c8d0e8" opacity="0.55"/>
    <circle cx="125" cy="22" r="1.0" fill="#c8d0e8" opacity="0.50"/>
    <circle cx="165" cy="8" r="1.4" fill="#c8d0e8" opacity="0.58"/>
    <circle cx="210" cy="18" r="1.0" fill="#c8d0e8" opacity="0.45"/>
    <circle cx="252" cy="12" r="1.2" fill="#c8d0e8" opacity="0.50"/>
    <circle cx="50" cy="38" r="0.8" fill="#c8d0e8" opacity="0.38"/>
    <circle cx="140" cy="45" r="0.8" fill="#c8d0e8" opacity="0.35"/>
    <circle cx="220" cy="35" r="0.9" fill="#c8d0e8" opacity="0.38"/>
    <circle cx="295" cy="15" r="1.0" fill="#c8d0e8" opacity="0.42"/>
    <!-- A few brighter pre-dawn stars -->
    <circle cx="48" cy="15" r="1.8" fill="#e0e8ff" opacity="0.70"/>
    <circle cx="185" cy="30" r="1.5" fill="#e0e8ff" opacity="0.60"/>
  </g>

  <!-- ============================================================ -->
  <!-- LAYER 1: FARTHEST MOUNTAIN SILHOUETTES (deep navy) -->
  <!-- ============================================================ -->
  <path d="M0,310 Q25,285 55,268 Q80,252 105,270 Q125,252 150,260 Q170,245 195,255 Q215,240 245,250 Q265,235 295,248 Q312,232 335,245 Q355,230 380,242 Q400,228 425,240 Q445,225 472,238 Q492,222 518,235 Q538,220 565,232 Q582,218 600,228 L600,330 L0,330 Z"
        fill="url(#farMtGrad)" opacity="0.88"/>
  <!-- Subtle golden tint on very far peaks (dawn catching tips) -->
  <path d="M240,250 Q265,235 295,248 Q312,232 335,245 Q325,238 310,245 Q292,255 270,248 Z" fill="#d97706" opacity="0.12"/>
  <path d="M440,228 Q465,220 490,232 Q480,225 465,228 Z" fill="#d97706" opacity="0.10"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: MIDDLE MOUNTAIN SILHOUETTES (dark slate) -->
  <!-- ============================================================ -->
  <path d="M0,325 Q30,300 65,282 Q92,262 120,278 Q142,258 170,268 Q192,250 220,262 Q242,245 268,258 Q285,242 308,255 Q325,240 348,252 Q365,238 390,248 Q410,235 435,246 Q452,232 478,244 Q496,230 520,242 Q540,228 565,240 Q580,230 600,238 L600,345 L0,345 Z"
        fill="url(#midMtGrad)" opacity="0.92"/>

  <!-- ============================================================ -->
  <!-- CLOUD LAYER (semi-transparent, across middle mountain zone) -->
  <!-- ============================================================ -->
  <!-- Cloud bank left -->
  <path d="M0,268 Q25,258 55,262 Q68,252 90,258 Q108,248 128,255 Q118,268 100,270 Q80,275 55,272 Q30,278 0,272 Z"
        fill="url(#cloudGrad)" filter="url(#cloudGlow)"/>
  <path d="M0,275 Q30,265 62,268 Q82,260 105,265 Q125,258 145,264 Q138,280 118,282 Q95,285 68,280 Q38,283 0,278 Z"
        fill="url(#cloudGrad)" opacity="0.80" filter="url(#cloudGlow)"/>
  <!-- Cloud bank center -->
  <path d="M120,262 Q145,250 172,255 Q192,244 218,252 Q238,242 262,250 Q248,264 228,268 Q205,272 180,268 Q155,274 128,270 Z"
        fill="url(#cloudGrad)" filter="url(#cloudGlow)"/>
  <path d="M150,270 Q172,258 200,263 Q222,252 248,260 Q268,250 292,258 Q278,272 258,276 Q235,280 210,275 Q185,280 158,276 Z"
        fill="url(#cloudGrad)" opacity="0.75"/>
  <!-- Cloud bank right, thicker (sun behind) -->
  <path d="M380,248 Q405,236 432,242 Q452,230 478,238 Q498,228 525,235 Q545,225 572,232 Q590,222 600,228 L600,262 Q580,255 558,260 Q535,254 515,262 Q492,256 470,264 Q448,258 428,264 Q405,258 385,264 Z"
        fill="url(#cloudGrad)" opacity="0.65" filter="url(#cloudGlow)"/>
  <!-- Cloud undersides (warm amber tinting from below) -->
  <path d="M380,262 Q408,268 435,264 Q458,270 485,264 Q510,268 538,263 Q562,268 600,262 L600,272 Q568,278 540,273 Q510,278 482,274 Q455,278 432,274 Q408,278 382,272 Z"
        fill="#c8751a" opacity="0.22"/>
  <path d="M0,278 Q35,284 68,280 Q95,285 125,280 Q150,284 180,279 Q162,286 135,288 Q105,290 72,286 Q40,290 0,285 Z"
        fill="#c8751a" opacity="0.18"/>

  <!-- ============================================================ -->
  <!-- MAIN SUMMIT PEAK (front and center) -->
  <!-- ============================================================ -->
  <!-- Dark base/body of main peak -->
  <path d="M200,420 Q225,395 248,368 Q268,342 285,315 Q298,292 308,270 Q315,255 318,242 Q320,232 318,225 Q316,218 310,212 Q305,205 300,198 Q295,190 300,185 Q305,180 308,175 Q312,170 316,168 Q320,166 325,165 Q330,164 335,166 Q340,168 344,173 Q348,178 350,185 Q353,192 350,200 Q346,208 340,215 Q335,222 332,230 Q329,240 330,252 Q332,266 338,282 Q345,300 355,320 Q365,342 380,368 Q395,395 415,420 Z"
        fill="url(#nearPeakGrad)" filter="url(#peakGlow)"/>
  <!-- Right side of peak (in deeper shadow) -->
  <path d="M325,165 Q332,170 338,180 Q345,192 342,205 Q338,218 332,230 Q329,242 330,256 Q332,272 340,290 Q350,312 362,338 Q375,362 390,390 Q402,412 415,430 L450,430 Q428,410 410,385 Q395,360 382,335 Q370,308 362,285 Q354,262 352,242 Q350,224 354,208 Q358,195 363,182 Q368,170 370,162 Q362,158 355,158 Q348,156 342,158 Q336,160 330,164 Q327,165 325,165 Z"
        fill="#0f1018" opacity="0.75"/>
  <!-- Left side of peak (slightly lit by dawn) -->
  <path d="M325,165 Q320,166 315,168 Q310,170 305,176 Q300,182 300,190 Q300,198 305,208 Q310,218 312,230 Q314,244 312,258 Q309,275 302,295 Q294,318 283,345 Q272,372 258,400 Q242,425 220,445 L190,445 Q212,425 228,398 Q245,370 258,342 Q270,315 278,290 Q287,266 290,244 Q292,225 290,208 Q288,192 284,178 Q280,165 278,155 Q290,152 300,154 Q312,156 320,160 Z"
        fill="#1a1520" opacity="0.65"/>
  <!-- Gold sunlit face of upper summit -->
  <path d="M300,185 Q308,175 318,168 Q328,162 338,168 Q348,175 352,188 Q346,200 338,212 Q330,224 325,238 Q320,252 322,268 Q315,255 310,240 Q305,225 302,210 Q299,197 300,185 Z"
        fill="url(#summitGold)"/>
  <!-- Second gold accent on right shoulder -->
  <path d="M335,200 Q342,190 350,188 Q356,195 358,210 Q355,222 348,235 Q342,248 340,262 Q336,248 333,232 Q330,218 335,200 Z"
        fill="#d97706" opacity="0.22"/>

  <!-- ============================================================ -->
  <!-- SECONDARY/FLANKING PEAKS (closer, dark) -->
  <!-- ============================================================ -->
  <!-- Left flanking peak -->
  <path d="M0,380 Q20,360 45,338 Q68,315 88,292 Q105,272 118,255 Q128,240 132,228 Q128,222 125,218 Q122,215 120,212 Q118,210 122,205 Q126,200 130,196 Q134,192 138,192 Q142,192 146,196 Q150,200 152,208 Q154,215 152,224 Q148,233 145,245 Q142,258 145,272 Q148,290 155,310 Q165,335 180,360 Q195,385 215,410 L0,410 Z"
        fill="#0f1018"/>
  <!-- Left peak faint gold tip -->
  <path d="M132,228 Q136,218 142,210 Q148,203 152,208 Q154,216 150,226 Q146,235 140,245 Q136,235 132,228 Z"
        fill="#c8751a" opacity="0.25"/>
  <!-- Right flanking peak -->
  <path d="M600,375 Q580,355 558,332 Q536,308 518,285 Q502,264 490,248 Q480,234 478,222 Q480,215 484,210 Q488,204 492,200 Q496,196 502,196 Q508,196 512,200 Q516,205 518,214 Q520,222 518,232 Q515,245 514,258 Q514,274 518,292 Q524,315 534,340 Q545,368 558,395 Q572,420 590,440 L600,440 Z"
        fill="#0f1018"/>
  <!-- Right peak faint gold tip -->
  <path d="M478,222 Q482,212 490,206 Q496,202 502,206 Q506,214 504,224 Q500,235 494,245 Q487,235 478,222 Z"
        fill="#c8751a" opacity="0.25"/>

  <!-- ============================================================ -->
  <!-- CAIRN OF STACKED STONES at summit top -->
  <!-- ============================================================ -->
  <g filter="url(#cairnShadow)" transform="translate(318,172)">
    <!-- Stone 1: base (widest) -->
    <path d="M-16,0 Q-14,-6 -8,-8 Q0,-10 8,-8 Q14,-6 16,0 Q14,4 8,6 Q0,7 -8,6 Q-14,4 -16,0 Z" fill="url(#stoneGrad)"/>
    <path d="M-16,0 Q-12,-2 -4,-2 Q4,-2 12,-1 Q14,-0.5 16,0" stroke="#fdf0d5" stroke-width="0.4" fill="none" opacity="0.3"/>
    <!-- Stone 1 lit face -->
    <path d="M8,-8 Q14,-6 16,0 Q14,4 8,6 Q12,2 14,-2 Z" fill="url(#stoneLit)" opacity="0.7"/>

    <!-- Stone 2 -->
    <path d="M-13,-8 Q-11,-14 -5,-16 Q2,-18 9,-15 Q13,-12 14,-7 Q12,-4 6,-3 Q0,-2 -6,-3 Q-12,-5 -13,-8 Z" fill="url(#stoneGrad)"/>
    <path d="M9,-15 Q13,-12 14,-7 Q12,-5 8,-4 Q12,-8 12,-12 Z" fill="url(#stoneLit)" opacity="0.7"/>

    <!-- Stone 3 -->
    <path d="M-11,-16 Q-9,-22 -3,-24 Q4,-26 10,-23 Q14,-20 13,-15 Q11,-12 5,-11 Q-2,-10 -7,-12 Q-11,-14 -11,-16 Z" fill="url(#stoneGrad)"/>
    <path d="M10,-23 Q14,-20 13,-15 Q11,-13 7,-12 Q11,-16 12,-20 Z" fill="url(#stoneLit)" opacity="0.65"/>

    <!-- Stone 4 (narrower) -->
    <path d="M-9,-24 Q-7,-30 -2,-32 Q4,-34 8,-31 Q12,-28 11,-23 Q9,-20 4,-19 Q-1,-18 -5,-20 Q-9,-22 -9,-24 Z" fill="url(#stoneGrad)"/>
    <path d="M8,-31 Q12,-28 11,-23 Q9,-21 6,-20 Q9,-24 10,-28 Z" fill="url(#stoneLit)" opacity="0.65"/>

    <!-- Stone 5 -->
    <path d="M-7,-32 Q-5,-38 0,-40 Q5,-42 8,-39 Q11,-36 10,-31 Q8,-28 3,-27 Q-1,-26 -4,-28 Q-7,-30 -7,-32 Z" fill="url(#stoneGrad)"/>
    <path d="M8,-39 Q11,-36 10,-31 Q8,-29 5,-28 Q8,-32 8,-36 Z" fill="url(#stoneLit)" opacity="0.60"/>

    <!-- Stone 6: capstone (smallest, top) -->
    <path d="M-5,-40 Q-3,-46 1,-48 Q5,-50 8,-47 Q10,-44 9,-40 Q7,-37 3,-36 Q-1,-36 -4,-38 Q-5,-39 -5,-40 Z" fill="url(#stoneGrad)"/>
    <path d="M8,-47 Q10,-44 9,-40 Q7,-38 5,-37 Q7,-41 7,-44 Z" fill="url(#stoneLit)" opacity="0.60"/>
    <!-- Capstone gold highlight from dawn light -->
    <path d="M5,-50 Q8,-48 9,-44 Q7,-40 5,-37 Q6,-41 7,-46 Z" fill="#f59e0b" opacity="0.45"/>

    <!-- Shadow beneath cairn on snow/rock -->
    <ellipse cx="0" cy="2" rx="14" ry="3.5" fill="#050408" opacity="0.55"/>
  </g>

  <!-- ============================================================ -->
  <!-- VALLEY FLOOR (barely visible, deep navy shadow at bottom) -->
  <!-- ============================================================ -->
  <path d="M0,410 Q80,395 165,402 Q250,408 320,400 Q390,392 468,400 Q535,406 600,400 L600,450 L0,450 Z"
        fill="url(#valleyGrad)"/>
  <rect x="0" y="430" width="600" height="20" fill="#040208"/>
  <!-- Valley terrain hints (very dark ridgelines at bottom) -->
  <path d="M0,418 Q40,408 90,412 Q145,416 205,408 Q265,400 330,408 Q390,415 445,408 Q500,402 545,408 Q572,412 600,408 L600,440 L0,440 Z"
        fill="#070510" opacity="0.85"/>
  <!-- Far valley texture -->
  <path d="M0,428 Q55,420 115,424 Q175,428 240,422 Q300,416 365,422 Q425,428 490,422 Q540,418 600,422 L600,450 L0,450 Z"
        fill="#050408" opacity="0.9"/>

  <!-- SNOW/FROST hints on upper summit -->
  <path d="M310,175 Q316,168 325,165 Q323,170 320,175 Q316,180 312,185 Z" fill="#fdf0d5" opacity="0.35"/>
  <path d="M328,165 Q335,164 340,168 Q336,173 332,178 Q329,173 328,165 Z" fill="#fdf0d5" opacity="0.30"/>
  <!-- Snow on left flanking peak tip -->
  <path d="M130,196 Q136,192 142,194 Q140,200 136,205 Q132,200 130,196 Z" fill="#e8d8c0" opacity="0.25"/>
  <!-- Snow on right flanking peak tip -->
  <path d="M498,198 Q504,196 510,200 Q507,205 502,208 Q498,204 498,198 Z" fill="#e8d8c0" opacity="0.25"/>

  <!-- ATMOSPHERIC HAZE LAYERS (depth/atmosphere) -->
  <!-- Horizon warm haze -->
  <rect x="0" y="290" width="600" height="18" fill="#8b4010" opacity="0.06"/>
  <rect x="0" y="300" width="600" height="12" fill="#d97706" opacity="0.05"/>
  <!-- Upper valley cold haze -->
  <rect x="0" y="350" width="600" height="25" fill="#0f2030" opacity="0.20"/>
</svg>
