<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-rep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="rep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="laptop-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen-content" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2352"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#rep-bg)" rx="18"/>

  <!-- Background decorative grid dots -->
  <g opacity="0.2">
    <circle cx="50" cy="50" r="2.5" fill="#2563eb"/>
    <circle cx="90" cy="50" r="2.5" fill="#2563eb"/>
    <circle cx="130" cy="50" r="2.5" fill="#2563eb"/>
    <circle cx="50" cy="90" r="2.5" fill="#2563eb"/>
    <circle cx="90" cy="90" r="2.5" fill="#2563eb"/>
    <circle cx="130" cy="90" r="2.5" fill="#2563eb"/>
    <circle cx="50" cy="130" r="2.5" fill="#2563eb"/>
    <circle cx="90" cy="130" r="2.5" fill="#2563eb"/>
    <circle cx="130" cy="130" r="2.5" fill="#2563eb"/>
    <circle cx="480" cy="50" r="2.5" fill="#2563eb"/>
    <circle cx="520" cy="50" r="2.5" fill="#2563eb"/>
    <circle cx="560" cy="50" r="2.5" fill="#2563eb"/>
    <circle cx="480" cy="90" r="2.5" fill="#2563eb"/>
    <circle cx="520" cy="90" r="2.5" fill="#2563eb"/>
    <circle cx="560" cy="90" r="2.5" fill="#2563eb"/>
  </g>

  <!-- Data sparklines top -->
  <path d="M50,200 L70,188 L90,195 L110,178 L130,185 L150,170 L170,175" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M430,200 L450,212 L470,195 L490,202 L510,185 L530,190 L550,178" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Laptop base/bottom -->
  <ellipse cx="265" cy="368" rx="175" ry="14" fill="#0f172a" opacity="0.2"/>
  <rect x="90" y="355" width="350" height="16" rx="6" fill="#374151" filter="url(#shadow-rep)"/>
  <!-- Laptop hinge -->
  <rect x="195" y="349" width="140" height="10" rx="4" fill="#1f2937"/>

  <!-- Laptop screen body -->
  <rect x="105" y="148" width="320" height="210" rx="10" fill="url(#laptop-body)" filter="url(#shadow-rep)"/>
  <!-- Screen bezel inner -->
  <rect x="115" y="158" width="300" height="188" rx="7" fill="url(#screen-content)"/>

  <!-- Screen: bar chart section -->
  <text x="130" y="180" font-family="Arial" font-size="8" fill="#93c5fd" opacity="0.8">ESG METRICS OVERVIEW</text>
  <line x1="130" y1="184" x2="400" y2="184" stroke="#93c5fd" stroke-width="0.5" opacity="0.4"/>

  <!-- Bar chart bars on screen -->
  <rect x="132" y="300" width="18" height="38" rx="2" fill="#60a5fa" opacity="0.8"/>
  <rect x="155" y="278" width="18" height="60" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="178" y="255" width="18" height="83" rx="2" fill="#2563eb" opacity="0.85"/>
  <rect x="201" y="265" width="18" height="73" rx="2" fill="#fbbf24" opacity="0.85"/>
  <rect x="224" y="248" width="18" height="90" rx="2" fill="#f59e0b" opacity="0.85"/>
  <rect x="247" y="238" width="18" height="100" rx="2" fill="#2563eb" opacity="0.9"/>
  <!-- Bar chart axis -->
  <line x1="128" y1="340" x2="275" y2="340" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="128" y1="340" x2="128" y2="195" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>

  <!-- Line graph on screen (right section) -->
  <path d="M285,310 L305,290 L325,295 L345,270 L365,258 L390,242" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Area under line -->
  <path d="M285,310 L305,290 L325,295 L345,270 L365,258 L390,242 L390,340 L285,340Z" fill="#34d399" opacity="0.12"/>
  <!-- Line dots -->
  <circle cx="285" cy="310" r="4" fill="#34d399"/>
  <circle cx="305" cy="290" r="4" fill="#34d399"/>
  <circle cx="325" cy="295" r="4" fill="#34d399"/>
  <circle cx="345" cy="270" r="4" fill="#34d399"/>
  <circle cx="365" cy="258" r="4" fill="#34d399"/>
  <circle cx="390" cy="242" r="4" fill="#34d399"/>
  <!-- Right axis -->
  <line x1="280" y1="340" x2="400" y2="340" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="340" x2="280" y2="195" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
  <!-- Divider line -->
  <line x1="272" y1="188" x2="272" y2="340" stroke="#93c5fd" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>

  <!-- Labels on screen -->
  <text x="280" y="180" font-family="Arial" font-size="7" fill="#60a5fa" opacity="0.7">Q1</text>
  <text x="347" y="180" font-family="Arial" font-size="7" fill="#60a5fa" opacity="0.7">Q2</text>

  <!-- Webcam dot on laptop -->
  <circle cx="265" cy="163" r="3" fill="#374151"/>
  <circle cx="265" cy="163" r="1.5" fill="#0f172a"/>

  <!-- Floating pie chart -->
  <g transform="translate(470,240)" filter="url(#shadow-rep)">
    <circle r="62" fill="white"/>
    <!-- Pie slices -->
    <path d="M0,0 L0,-62 A62,62,0,0,1,53.7,31Z" fill="#2563eb"/>
    <path d="M0,0 L53.7,31 A62,62,0,0,1,-18.6,59.2Z" fill="#f59e0b"/>
    <path d="M0,0 L-18.6,59.2 A62,62,0,0,1,-62,0Z" fill="#34d399"/>
    <path d="M0,0 L-62,0 A62,62,0,0,1,0,-62Z" fill="#e0e7ff"/>
    <!-- Pie center hole (donut) -->
    <circle r="28" fill="white"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#1e3a5f">ESG</text>
    <!-- Pie border -->
    <circle r="62" fill="none" stroke="white" stroke-width="3"/>
  </g>

  <!-- Pie chart legend -->
  <rect x="418" y="315" width="10" height="10" rx="2" fill="#2563eb"/>
  <text x="432" y="324" font-family="Arial" font-size="9" fill="#1e3a5f">Environmental</text>
  <rect x="418" y="330" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="432" y="339" font-family="Arial" font-size="9" fill="#1e3a5f">Social</text>
  <rect x="418" y="345" width="10" height="10" rx="2" fill="#34d399"/>
  <text x="432" y="354" font-family="Arial" font-size="9" fill="#1e3a5f">Governance</text>
  <rect x="418" y="360" width="10" height="10" rx="2" fill="#e0e7ff"/>
  <text x="432" y="369" font-family="Arial" font-size="9" fill="#1e3a5f">Other</text>

  <!-- Magnifying glass -->
  <g transform="translate(95,295)" filter="url(#shadow-rep)">
    <circle r="38" fill="white" opacity="0.95"/>
    <circle r="30" fill="#dbeafe"/>
    <!-- Glass shine -->
    <circle cx="-8" cy="-8" r="8" fill="white" opacity="0.4"/>
    <!-- Magnifying handle -->
    <line x1="22" y1="22" x2="48" y2="48" stroke="#1e3a5f" stroke-width="9" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="48" y2="48" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <!-- Inside glass: mini chart -->
    <rect x="-22" y="5" width="8" height="20" rx="2" fill="#2563eb" opacity="0.7"/>
    <rect x="-10" y="-5" width="8" height="30" rx="2" fill="#3b82f6" opacity="0.7"/>
    <rect x="2" y="-12" width="8" height="37" rx="2" fill="#60a5fa" opacity="0.7"/>
    <line x1="-22" y1="26" x2="14" y2="26" stroke="#1e3a5f" stroke-width="1.5" opacity="0.4"/>
    <!-- Glass border -->
    <circle r="30" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  </g>

  <!-- Data flow dots/sparklines bottom -->
  <circle cx="200" cy="415" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="220" cy="408" r="4" fill="#2563eb" opacity="0.7"/>
  <circle cx="240" cy="416" r="4" fill="#2563eb" opacity="0.5"/>
  <circle cx="260" cy="405" r="4" fill="#2563eb" opacity="0.8"/>
  <circle cx="280" cy="412" r="4" fill="#2563eb" opacity="0.6"/>
  <circle cx="300" cy="400" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="320" cy="410" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="340" cy="403" r="4" fill="#f59e0b" opacity="0.7"/>
  <path d="M200,415 L220,408 L240,416 L260,405 L280,412 L300,400 L320,410 L340,403" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
