<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-team" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a5f" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="globe-grad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bg-grad)" rx="18"/>

  <!-- Decorative background circles -->
  <circle cx="80" cy="80" r="55" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="530" cy="370" r="70" fill="#bfdbfe" opacity="0.4"/>
  <circle cx="520" cy="90" r="35" fill="#fef3c7" opacity="0.6"/>
  <circle cx="90" cy="380" r="45" fill="#fef3c7" opacity="0.5"/>

  <!-- Connection lines from figures to globe -->
  <line x1="150" y1="240" x2="270" y2="225" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
  <line x1="450" y1="240" x2="330" y2="225" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
  <line x1="300" y1="340" x2="300" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Globe -->
  <circle cx="300" cy="210" r="90" fill="url(#globe-grad)" filter="url(#shadow-team)"/>
  <!-- Globe grid lines -->
  <ellipse cx="300" cy="210" rx="90" ry="35" fill="none" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <ellipse cx="300" cy="180" rx="75" ry="20" fill="none" stroke="white" stroke-width="1.2" opacity="0.25"/>
  <ellipse cx="300" cy="240" rx="75" ry="20" fill="none" stroke="white" stroke-width="1.2" opacity="0.25"/>
  <line x1="300" y1="120" x2="300" y2="300" stroke="white" stroke-width="1.2" opacity="0.3"/>
  <line x1="240" y1="125" x2="240" y2="295" stroke="white" stroke-width="1" opacity="0.2"/>
  <line x1="360" y1="125" x2="360" y2="295" stroke="white" stroke-width="1" opacity="0.2"/>
  <!-- Continents (simplified shapes) -->
  <path d="M265,175 Q275,165 290,168 Q302,162 310,172 Q320,168 328,178 Q322,190 310,188 Q298,195 285,190 Q272,188 265,175Z" fill="#34d399" opacity="0.85"/>
  <path d="M275,205 Q282,198 292,202 Q300,198 308,205 Q304,215 295,218 Q283,216 275,205Z" fill="#34d399" opacity="0.75"/>
  <path d="M315,195 Q325,188 336,192 Q343,200 338,210 Q328,214 318,208 Q313,202 315,195Z" fill="#34d399" opacity="0.8"/>

  <!-- Globe shine -->
  <ellipse cx="272" cy="178" rx="18" ry="12" fill="white" opacity="0.12" transform="rotate(-20,272,178)"/>

  <!-- Left figure (teal top) -->
  <circle cx="130" cy="195" r="22" fill="#1e3a5f" filter="url(#shadow-team)"/>
  <circle cx="130" cy="188" r="13" fill="#fbbf24"/>
  <path d="M108,220 Q130,208 152,220 L155,260 Q130,268 105,260Z" fill="#1e3a5f"/>
  <rect x="105" y="258" width="50" height="14" rx="7" fill="#1e3a5f" opacity="0.7"/>
  <!-- Left figure arms -->
  <path d="M110,230 Q95,242 88,255" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M150,230 Q165,242 172,255" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Left figure laptop -->
  <rect x="78" y="252" width="28" height="18" rx="3" fill="#2563eb"/>
  <rect x="75" y="268" width="34" height="4" rx="2" fill="#1e3a5f"/>

  <!-- Right figure (navy top) -->
  <circle cx="470" cy="195" r="22" fill="#1e3a5f" filter="url(#shadow-team)"/>
  <circle cx="470" cy="188" r="13" fill="#f59e0b"/>
  <path d="M448,220 Q470,208 492,220 L495,260 Q470,268 445,260Z" fill="#2563eb"/>
  <rect x="445" y="258" width="50" height="14" rx="7" fill="#2563eb" opacity="0.7"/>
  <!-- Right figure arms -->
  <path d="M450,230 Q435,242 428,255" stroke="#2563eb" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M490,230 Q505,242 512,255" stroke="#2563eb" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Right figure tablet -->
  <rect x="504" y="246" width="22" height="28" rx="3" fill="#1e3a5f"/>
  <rect x="507" y="250" width="16" height="18" rx="1" fill="#dbeafe"/>

  <!-- Bottom figure -->
  <circle cx="300" cy="355" r="22" fill="#1e3a5f" filter="url(#shadow-team)"/>
  <circle cx="300" cy="348" r="13" fill="#34d399"/>
  <path d="M278,380 Q300,368 322,380 L325,415 Q300,422 275,415Z" fill="#1e3a5f"/>
  <rect x="275" y="413" width="50" height="14" rx="7" fill="#1e3a5f" opacity="0.7"/>

  <!-- Leaf decorations -->
  <path d="M55,140 Q65,120 85,130 Q75,150 55,140Z" fill="#34d399" opacity="0.8"/>
  <path d="M62,138 Q72,128 62,148" stroke="#16a34a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M500,130 Q520,115 535,130 Q520,148 500,130Z" fill="#34d399" opacity="0.7"/>
  <path d="M508,128 Q520,122 508,142" stroke="#16a34a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M70,340 Q85,322 100,335 Q88,352 70,340Z" fill="#34d399" opacity="0.7"/>
  <path d="M520,310 Q538,295 550,310 Q536,325 520,310Z" fill="#34d399" opacity="0.65"/>

  <!-- SDG-style color dots at bottom -->
  <rect x="155" y="420" width="22" height="22" rx="4" fill="#e5243b"/>
  <rect x="183" y="420" width="22" height="22" rx="4" fill="#dda63a"/>
  <rect x="211" y="420" width="22" height="22" rx="4" fill="#4c9f38"/>
  <rect x="239" y="420" width="22" height="22" rx="4" fill="#c5192d"/>
  <rect x="267" y="420" width="22" height="22" rx="4" fill="#ff3a21"/>
  <rect x="295" y="420" width="22" height="22" rx="4" fill="#26bde2"/>
  <rect x="323" y="420" width="22" height="22" rx="4" fill="#fcc30b"/>
  <rect x="351" y="420" width="22" height="22" rx="4" fill="#a21942"/>
  <rect x="379" y="420" width="22" height="22" rx="4" fill="#fd6925"/>
  <rect x="407" y="420" width="22" height="22" rx="4" fill="#dd1367"/>

  <!-- Connection dots on lines -->
  <circle cx="210" cy="234" r="5" fill="#f59e0b"/>
  <circle cx="390" cy="234" r="5" fill="#f59e0b"/>
  <circle cx="300" cy="320" r="5" fill="#f59e0b"/>

  <!-- Title text area hint circles -->
  <circle cx="300" cy="210" r="4" fill="white" opacity="0.6"/>
</svg>
