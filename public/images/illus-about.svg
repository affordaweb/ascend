<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <filter id="shadow-about" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="building-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="building-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="450" fill="url(#sky-grad)" rx="18"/>

  <!-- Sun -->
  <circle cx="490" cy="90" r="45" fill="#fbbf24" opacity="0.9" filter="url(#shadow-about)"/>
  <circle cx="490" cy="90" r="38" fill="#fef3c7"/>
  <circle cx="490" cy="90" r="28" fill="#f59e0b"/>
  <!-- Sun rays -->
  <line x1="490" y1="28" x2="490" y2="18" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="490" y1="152" x2="490" y2="162" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="428" y1="90" x2="418" y2="90" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="552" y1="90" x2="562" y2="90" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="447" y1="47" x2="440" y2="40" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="533" y1="133" x2="540" y2="140" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="533" y1="47" x2="540" y2="40" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="447" y1="133" x2="440" y2="140" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Ground -->
  <ellipse cx="300" cy="390" rx="280" ry="30" fill="#bfdbfe" opacity="0.5"/>
  <rect x="20" y="385" width="560" height="50" rx="8" fill="#dbeafe"/>

  <!-- Background buildings (smaller) -->
  <rect x="80" y="240" width="55" height="155" rx="4" fill="#93c5fd" opacity="0.5"/>
  <rect x="88" y="255" width="12" height="16" rx="2" fill="white" opacity="0.7"/>
  <rect x="105" y="255" width="12" height="16" rx="2" fill="white" opacity="0.7"/>
  <rect x="88" y="278" width="12" height="16" rx="2" fill="white" opacity="0.6"/>
  <rect x="105" y="278" width="12" height="16" rx="2" fill="white" opacity="0.6"/>
  <rect x="88" y="301" width="12" height="16" rx="2" fill="white" opacity="0.5"/>
  <rect x="105" y="301" width="12" height="16" rx="2" fill="white" opacity="0.5"/>

  <rect x="455" y="270" width="50" height="125" rx="4" fill="#93c5fd" opacity="0.45"/>
  <rect x="462" y="285" width="10" height="14" rx="2" fill="white" opacity="0.6"/>
  <rect x="477" y="285" width="10" height="14" rx="2" fill="white" opacity="0.6"/>
  <rect x="462" y="305" width="10" height="14" rx="2" fill="white" opacity="0.5"/>
  <rect x="477" y="305" width="10" height="14" rx="2" fill="white" opacity="0.5"/>

  <!-- Main building body -->
  <rect x="155" y="155" width="290" height="235" rx="6" fill="url(#building-main)" filter="url(#shadow-about)"/>
  <!-- Building side panel (3D effect) -->
  <polygon points="445,155 480,130 480,365 445,390" fill="url(#building-side)" opacity="0.8"/>
  <!-- Building top (flat roof) -->
  <polygon points="155,155 190,130 480,130 445,155" fill="#3b82f6" opacity="0.9"/>

  <!-- Building windows grid -->
  <rect x="175" y="175" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.75"/>
  <rect x="217" y="175" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.75"/>
  <rect x="259" y="175" width="32" height="24" rx="3" fill="#fbbf24" opacity="0.85"/>
  <rect x="301" y="175" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.75"/>
  <rect x="343" y="175" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.75"/>
  <rect x="385" y="175" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.65"/>

  <rect x="175" y="210" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.65"/>
  <rect x="217" y="210" width="32" height="24" rx="3" fill="#fbbf24" opacity="0.8"/>
  <rect x="259" y="210" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.65"/>
  <rect x="301" y="210" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.65"/>
  <rect x="343" y="210" width="32" height="24" rx="3" fill="#fbbf24" opacity="0.75"/>
  <rect x="385" y="210" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.6"/>

  <rect x="175" y="245" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.6"/>
  <rect x="217" y="245" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.6"/>
  <rect x="259" y="245" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.6"/>
  <rect x="301" y="245" width="32" height="24" rx="3" fill="#fbbf24" opacity="0.7"/>
  <rect x="343" y="245" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.6"/>
  <rect x="385" y="245" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.55"/>

  <rect x="175" y="280" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.55"/>
  <rect x="217" y="280" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.55"/>
  <rect x="259" y="280" width="32" height="24" rx="3" fill="#fbbf24" opacity="0.65"/>
  <rect x="301" y="280" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.55"/>
  <rect x="343" y="280" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.55"/>
  <rect x="385" y="280" width="32" height="24" rx="3" fill="#dbeafe" opacity="0.5"/>

  <!-- Main entrance door -->
  <rect x="270" y="330" width="60" height="60" rx="5" fill="#1e3a5f"/>
  <rect x="278" y="338" width="20" height="52" rx="3" fill="#93c5fd" opacity="0.6"/>
  <rect x="302" y="338" width="20" height="52" rx="3" fill="#93c5fd" opacity="0.6"/>
  <circle cx="299" cy="365" r="3" fill="#fbbf24"/>
  <circle cx="303" cy="365" r="3" fill="#fbbf24"/>

  <!-- Company logo on building -->
  <circle cx="300" cy="145" r="15" fill="#fbbf24"/>
  <text x="300" y="150" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e3a5f">A</text>

  <!-- Steps in front -->
  <rect x="230" y="388" width="140" height="10" rx="3" fill="#93c5fd" opacity="0.7"/>
  <rect x="245" y="380" width="110" height="10" rx="3" fill="#93c5fd" opacity="0.6"/>

  <!-- 4 human figures in front -->
  <!-- Figure 1 -->
  <circle cx="185" cy="355" r="12" fill="#fbbf24"/>
  <rect x="174" y="368" width="22" height="30" rx="5" fill="#1e3a5f"/>
  <rect x="169" y="395" width="10" height="18" rx="4" fill="#1e3a5f"/>
  <rect x="185" y="395" width="10" height="18" rx="4" fill="#1e3a5f"/>

  <!-- Figure 2 -->
  <circle cx="235" cy="352" r="12" fill="#f59e0b"/>
  <rect x="224" y="365" width="22" height="30" rx="5" fill="#2563eb"/>
  <rect x="219" y="392" width="10" height="18" rx="4" fill="#2563eb"/>
  <rect x="235" y="392" width="10" height="18" rx="4" fill="#2563eb"/>

  <!-- Figure 3 -->
  <circle cx="365" cy="352" r="12" fill="#fbbf24"/>
  <rect x="354" y="365" width="22" height="30" rx="5" fill="#2563eb"/>
  <rect x="349" y="392" width="10" height="18" rx="4" fill="#2563eb"/>
  <rect x="365" y="392" width="10" height="18" rx="4" fill="#2563eb"/>

  <!-- Figure 4 -->
  <circle cx="415" cy="355" r="12" fill="#f59e0b"/>
  <rect x="404" y="368" width="22" height="30" rx="5" fill="#1e3a5f"/>
  <rect x="399" y="395" width="10" height="18" rx="4" fill="#1e3a5f"/>
  <rect x="415" y="395" width="10" height="18" rx="4" fill="#1e3a5f"/>

  <!-- Upward growth arrow -->
  <path d="M80,310 L80,180 L100,200 M80,180 L60,200" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow-about)"/>
  <circle cx="80" cy="310" r="5" fill="#34d399"/>
  <circle cx="80" cy="260" r="4" fill="#34d399" opacity="0.6"/>
  <circle cx="80" cy="220" r="4" fill="#34d399" opacity="0.4"/>

  <!-- Small clouds -->
  <ellipse cx="150" cy="65" rx="35" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="175" cy="58" rx="25" ry="16" fill="white" opacity="0.7"/>
  <ellipse cx="125" cy="62" rx="22" ry="14" fill="white" opacity="0.6"/>

  <ellipse cx="370" cy="48" rx="28" ry="15" fill="white" opacity="0.6"/>
  <ellipse cx="392" cy="42" rx="20" ry="13" fill="white" opacity="0.6"/>
  <ellipse cx="350" cy="45" rx="18" ry="12" fill="white" opacity="0.5"/>
</svg>
